name: 1) Gerar upload keystore (rodar 1x)

# Cria a "chave de upload" do app (upload keystore) na nuvem — você NÃO precisa de Java/JDK
# instalado. Rode UMA vez. Depois baixe o artefato, guarde o upload.keystore em local SEGURO
# (perder = nunca mais consegue atualizar o app na Play) e configure o secret ANDROID_KEYSTORE_B64.
#
# PRÉ-REQUISITO: em Settings → Secrets and variables → Actions, crie os secrets:
#   ANDROID_KS_PASS   = uma senha forte (anote — vai usar no build também)
#   ANDROID_KEY_ALIAS = upload   (ou o nome que quiser)

on:
  workflow_dispatch:
    inputs:
      dname:
        description: 'Dados do certificado'
        required: true
        default: 'CN=Vammo Colab, OU=Fleet, O=Vammo, L=Sao Paulo, ST=SP, C=BR'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gerar keystore
        env:
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Crie os secrets ANDROID_KS_PASS e ANDROID_KEY_ALIAS antes de rodar."; exit 1
          fi
          keytool -genkeypair -v -keystore upload.keystore -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "${{ inputs.dname }}"
          base64 -w0 upload.keystore > upload.keystore.b64
          echo "OK. Baixe o artefato 'upload-keystore'."
          echo "1) guarde upload.keystore em local SEGURO (backup!)."
          echo "2) crie o secret ANDROID_KEYSTORE_B64 com o CONTEÚDO de upload.keystore.b64."
      - uses: actions/upload-artifact@v4
        with:
          name: upload-keystore
          path: |
            upload.keystore
            upload.keystore.b64
          retention-days: 1
