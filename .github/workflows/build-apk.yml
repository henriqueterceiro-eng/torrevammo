name: Build Colab APK

# Gera o APK do app nativo (colab com GPS em background) e publica como artefato
# pra baixar. Roda só quando mexe no nativo, ou manualmente (Actions → Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch AndroidManifest (permissões de localização)
        run: node scripts/patch-manifest.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: vammo-colab-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publica num Release de tag fixa "apk-latest" → link direto, sem login, pro motorista
      # instalar abrindo a URL no celular. Cada build atualiza esse mesmo release.
      - name: Publicar Release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Vammo Colab — APK (última versão)
          body: |
            APK do app Vammo Colab com GPS em background.
            Instale abrindo este link no celular Android e tocando em **app-debug.apk**.
            Na 1ª abertura, em localização escolha **"Permitir o tempo todo"**.
          files: native/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: "true"
