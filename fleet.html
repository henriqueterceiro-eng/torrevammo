<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vammo · Central de Fleet</title>
<link rel="icon" href="/icon-192.svg">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --bg:#070e1b; --surf:#0d1a2e; --surf2:#132540; --bdr:#1e3352;
  --bdr2:#274468; --acc:#00B4E5; --acc2:#0a95c0;
  --txt:#e9f4fb; --txt2:#9db2c9; --txt3:#5f7591;
  --novo:#ef4444; --aceito:#f59e0b; --atrib:#a855f7; --rota:#00B4E5; --base:#22c55e; --conc:#64748b;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:
  radial-gradient(1100px 500px at 82% -8%, rgba(0,180,229,0.10), transparent),
  radial-gradient(900px 500px at 5% 110%, rgba(34,197,94,0.06), transparent),
  var(--bg);
  color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:#22405f;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ===== HEADER ===== */
#top{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:11px 18px;background:linear-gradient(180deg,rgba(13,26,46,0.9),rgba(7,14,27,0.7));border-bottom:1px solid var(--bdr2);backdrop-filter:blur(14px);z-index:20}
#top .logo{color:var(--acc);line-height:0;flex:0 0 auto}
#top .logo svg{width:104px;height:auto;display:block}
#top .sub{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--txt2);border-left:1px solid var(--bdr2);padding-left:14px}
#top .sub b{color:var(--acc)}
#top .spacer{flex:1}
#top .stat{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--txt2);font-family:var(--mono)}
#top .stat b{color:var(--txt);font-size:15px}
#syncdot{width:9px;height:9px;border-radius:50%;background:#f59e0b;box-shadow:0 0 8px currentColor;display:inline-block}
#syncdot.on{background:#22c55e}
.btn-open{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#041824;font-weight:800;font-size:13px;padding:9px 16px;border-radius:10px;box-shadow:0 4px 16px rgba(0,180,229,0.35);transition:transform .1s}
.btn-open:hover{transform:translateY(-1px)}
.btn-open:active{transform:translateY(0)}
.btn-demo{background:transparent;border:1px solid var(--bdr2);color:var(--txt2);font-weight:700;font-size:11px;padding:7px 11px;border-radius:9px;white-space:nowrap}
.btn-demo:hover{border-color:var(--acc);color:var(--acc)}
.btn-demo.on{background:rgba(251,191,36,0.14);border-color:#fbbf24;color:#fbbf24}
#userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1px solid var(--bdr2);border-radius:20px;padding:3px 5px 3px 3px}
#userchip img{width:26px;height:26px;border-radius:50%}
#userchip .un{font-size:11px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#userchip .lo{background:transparent;border:none;color:var(--txt3);font-size:14px;padding:0 4px}
#userchip .lo:hover{color:var(--novo)}

/* ===== BOARD ===== */
#board{flex:1;min-height:0;display:flex;gap:14px;padding:16px 18px;overflow-x:auto;overflow-y:hidden;align-items:stretch}
.col{flex:0 0 300px;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,rgba(19,37,64,0.5),rgba(13,26,46,0.35));border:1px solid var(--bdr);border-radius:14px;overflow:hidden}
.col .ch{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--bdr);position:relative}
.col .ch::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.col .ch .ci{font-size:16px}
.col .ch .ct{font-weight:800;font-size:12.5px;letter-spacing:0.2px}
.col .ch .cs{font-size:9.5px;color:var(--txt3);font-weight:600;margin-top:1px;line-height:1.25}
.col .ch .cn{margin-left:auto;background:var(--c);color:#04121e;font-weight:900;font-size:12px;font-family:var(--mono);min-width:26px;text-align:center;padding:3px 8px;border-radius:11px}
.col .body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px}
.col .empty{margin:auto;text-align:center;color:var(--txt3);font-size:11px;padding:20px 10px;line-height:1.5}
.col .empty .e{font-size:30px;opacity:0.35;display:block;margin-bottom:6px}

/* ===== CARD ===== */
.kc{background:var(--surf);border:1px solid var(--bdr);border-left:3px solid var(--c);border-radius:10px;padding:11px 12px;transition:border-color .12s,transform .08s}
.kc:hover{border-color:var(--acc);transform:translateY(-1px)}
.kc.aguard{border-left-color:#22c55e;background:linear-gradient(90deg,rgba(34,197,94,0.09),var(--surf) 60%)}
.kc .r1{display:flex;align-items:center;gap:7px}
.kc .num{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:800}
.kc .cli{font-weight:800;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .ico{font-size:15px}
.kc .mv{font-size:11px;color:var(--txt);margin-top:5px;line-height:1.3}
.kc .end{font-size:10px;color:var(--txt2);margin-top:3px;line-height:1.3;display:flex;gap:4px}
.kc .end span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--txt3);font-family:var(--mono);margin-top:7px}
.kc .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kc .b{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:0.2px;white-space:nowrap}
.b-aguard{background:#16a34a;color:#fff}
.b-transf{background:rgba(168,85,247,0.18);color:#d8b4fe;border:1px solid rgba(168,85,247,0.4)}
.b-ext{background:#f59e0b;color:#1a1200}
.kc .who{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--bdr)}
.kc .wl{display:flex;align-items:center;gap:8px}
.kc .wl .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 24px;color:#04121e}
.kc .wl .wi{min-width:0}
.kc .wl .wr{font-size:8.5px;color:var(--txt3);font-weight:800;text-transform:uppercase;letter-spacing:0.4px;line-height:1}
.kc .wl .wn{font-size:12px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .track{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:9px;padding:8px;background:rgba(0,180,229,0.13);border:1px solid var(--acc);color:var(--acc);font-weight:800;font-size:11.5px;border-radius:8px;text-decoration:none}
.kc .track:hover{background:rgba(0,180,229,0.22)}
.kc .aberto{font-size:9.5px;color:var(--txt3);margin-top:8px;padding-top:7px;border-top:1px dashed var(--bdr);line-height:1.3}
.kc .aberto b{color:var(--txt2)}

/* driver chip (coluna Na base) */
.dchip{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--bdr);border-left:3px solid var(--base);border-radius:10px;padding:9px 11px}
.dchip .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#04121e;flex:0 0 30px}
.dchip .di{min-width:0;flex:1}
.dchip .dn{font-size:12.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip .db{font-size:10px;color:var(--txt2);font-family:var(--mono);margin-top:1px}
.dchip .dbase{font-size:9px;font-weight:800;color:var(--base);background:rgba(34,197,94,0.14);padding:2px 7px;border-radius:6px;white-space:nowrap}

/* ===== LOGIN GATE ===== */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1000px 500px at 50% -10%,rgba(0,180,229,0.16),transparent),rgba(4,10,18,0.98)}
#gate .card{background:rgba(19,33,52,0.94);border:1px solid var(--bdr2);border-radius:20px;padding:36px 32px;max-width:390px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.6)}
#gate .lg{color:var(--acc);line-height:0}
#gate .lg svg{width:150px;height:auto;margin:0 auto;display:block}
#gate .sub{font-size:12px;color:var(--txt2);font-weight:800;letter-spacing:2px;text-transform:uppercase;margin:8px 0 22px}
#gate .txt{font-size:13px;color:var(--txt);margin-bottom:22px;line-height:1.5}
#gbtn{display:flex;justify-content:center;min-height:44px}
#gerr{font-size:11.5px;color:#fca5a5;margin-top:14px;min-height:16px;line-height:1.4}

/* ===== MODAL Abrir chamado ===== */
#modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.82)}
#modal.on{display:flex}
#modal .m{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;width:460px;max-width:94vw;max-height:92vh;overflow:auto;padding:24px}
#modal h2{font-size:18px;margin-bottom:4px}
#modal .msub{font-size:12px;color:var(--txt2);margin-bottom:18px;line-height:1.4}
#modal label{display:block;font-size:11px;color:var(--txt2);font-weight:700;margin:12px 0 5px}
#modal input,#modal select,#modal textarea{width:100%;background:var(--surf2);border:1px solid var(--bdr2);color:var(--txt);border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit}
#modal input:focus,#modal select:focus,#modal textarea:focus{outline:none;border-color:var(--acc)}
.mplate{background:linear-gradient(180deg,#0b3a6b,#0a2c52);border:2px solid #0e4d8f;border-radius:9px;padding:5px 5px 7px;text-align:center;margin-bottom:6px}
.mplate .mt{display:flex;justify-content:space-between;align-items:center;font-size:8px;font-weight:800;color:#bfe3ff;padding:1px 5px;letter-spacing:0.5px}
.mplate input{background:#fff;color:#0a1420;border:none;text-align:center;font-family:var(--mono);font-weight:800;font-size:22px;letter-spacing:3px;text-transform:uppercase;margin-top:4px}
#mtransf{display:none;margin-top:12px;padding:11px;border:1px solid rgba(168,85,247,0.5);background:rgba(168,85,247,0.08);border-radius:10px}
#mtransf .tt{font-size:11px;color:#d8b4fe;font-weight:800;margin-bottom:8px}
.mrow{display:flex;gap:8px;margin-top:20px}
.mrow button{flex:1;padding:12px;border-radius:10px;font-weight:800;font-size:13px}
.mrow .cancel{flex:0 0 34%;background:transparent;border:1px solid var(--bdr2);color:var(--txt2)}
.mrow .go{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#041824}
.mrow .go:disabled{opacity:0.45;cursor:not-allowed}
/* ---- WIZARD de movimentação ---- */
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.mx{background:transparent;border:none;color:var(--txt3);font-size:20px;line-height:1;padding:2px 6px}
.mx:hover{color:var(--txt)}
.wsec{margin-top:18px;animation:wfade .18s ease}
@keyframes wfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wlabel{font-size:11px;color:var(--txt2);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.wlabel .wn{background:var(--acc);color:#04121e;width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 19px}
.wtipo{display:flex;flex-direction:column;gap:8px}
.wtipo button{display:flex;align-items:center;gap:12px;padding:13px;background:var(--surf2);border:1px solid var(--bdr2);border-radius:11px;text-align:left;color:var(--txt);width:100%}
.wtipo button:hover{border-color:var(--acc)}
.wtipo button.sel{border-color:var(--acc);background:rgba(0,180,229,0.12);box-shadow:inset 0 0 0 1px var(--acc)}
.wtipo .em{font-size:23px;flex:0 0 auto}
.wtipo .tt{font-weight:800;font-size:13px}
.wtipo .ts{font-size:10.5px;color:var(--txt2);font-weight:600}
.wqty{display:flex;align-items:center;gap:14px}
.wqty button{width:44px;height:44px;border-radius:12px;background:var(--surf2);border:1px solid var(--bdr2);color:var(--acc);font-size:24px;font-weight:800;line-height:1}
.wqty button:hover{border-color:var(--acc)}
.wqty .qn{font-size:32px;font-weight:900;font-family:var(--mono);min-width:54px;text-align:center;color:var(--txt)}
.moto-card{background:var(--surf2);border:1px solid var(--bdr2);border-radius:11px;padding:11px;margin-top:9px}
.moto-card .mh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;font-weight:800;color:var(--txt2)}
.moto-card .mnum{background:var(--atrib);color:#fff;width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 20px}
.moto-card input{text-transform:uppercase;font-family:var(--mono);letter-spacing:2px;font-weight:800;font-size:16px;text-align:center}
.mstat{font-size:11px;margin-top:7px;line-height:1.4;min-height:15px;font-weight:600}
.mstat.ok{color:#4ade80}
.mstat.warn{color:#fbbf24}
.mstat.err{color:#fca5a5}
.mstat.info{color:var(--txt2)}

/* card: clique + dica de rota */
.kc{cursor:pointer}
.kc .rotahint{margin-top:9px;padding:7px;text-align:center;background:rgba(0,180,229,0.1);border:1px dashed var(--acc);color:var(--acc);font-weight:700;font-size:10.5px;border-radius:8px}

/* ===== DETALHE / HISTÓRICO ===== */
#det{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.82)}
#det.on{display:flex}
#det .m{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;width:440px;max-width:94vw;max-height:92vh;overflow:auto;padding:22px}
.deth{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.deth h2{font-size:16px;line-height:1.25}
.det-chip{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:11px;text-transform:uppercase;letter-spacing:.3px;margin-top:6px}
.det-sec{margin-top:16px}
.det-sec .st{font-size:10px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.det-total{display:flex;align-items:center;justify-content:space-between;background:var(--surf2);border:1px solid var(--bdr2);border-radius:11px;padding:12px 14px;margin-top:4px}
.det-total .tl{font-size:11px;color:var(--txt2);font-weight:700}
.det-total .tv{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--acc)}
/* timeline */
.tl-row{display:flex;gap:11px;position:relative;padding-bottom:15px}
.tl-row:last-child{padding-bottom:0}
.tl-row .tl-ic{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--surf2);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2}
.tl-row.pend .tl-ic{border-color:var(--bdr2);opacity:.5}
.tl-row::before{content:'';position:absolute;left:14px;top:30px;bottom:-2px;width:2px;background:var(--bdr2)}
.tl-row:last-child::before{display:none}
.tl-bd{flex:1;padding-top:3px}
.tl-bd .tl-l{font-size:12.5px;font-weight:700}
.tl-bd .tl-t{font-size:10.5px;color:var(--txt3);font-family:var(--mono);margin-top:1px}
.tl-dur{margin-left:auto;font-size:11px;font-weight:800;font-family:var(--mono);color:var(--txt2);background:var(--surf2);padding:2px 8px;border-radius:8px;height:fit-content;align-self:center}
.det-motos{display:flex;flex-direction:column;gap:5px}
.det-moto{display:flex;align-items:center;gap:8px;font-size:11.5px;background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;padding:7px 9px}
.det-moto .pl{font-family:var(--mono);font-weight:800;color:var(--txt)}
.det-moto .mo{color:var(--txt2);font-size:10px}
.det-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:16px;padding:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#041824;font-weight:800;font-size:13px;border-radius:10px;text-decoration:none}
.det-nota{display:inline-flex;align-items:center;gap:5px;background:rgba(34,197,94,0.14);border:1px solid #22c55e;color:#4ade80;font-weight:800;font-size:12px;padding:4px 10px;border-radius:9px}

/* ===== SIMULADOR ===== */
#sim{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,0.88)}
#sim.on{display:flex}
.simcard{background:var(--surf);border:1px solid var(--bdr2);border-radius:16px;width:620px;max-width:96vw;max-height:94vh;overflow:hidden;display:flex;flex-direction:column}
.simhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bdr)}
.simt{font-size:15px;font-weight:800}
.simsub{font-size:11px;color:var(--txt2);margin-top:2px}
#simMap{height:min(56vh,440px);width:100%;background:#0a1428}
.leaflet-container{background:#0a1428 !important;font-family:var(--sans)}
.simfoot{padding:13px 18px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:10px}
.simstat{font-size:12px;font-weight:700;color:var(--txt)}
.simstat #simEta{color:var(--acc)}
.simprog{height:7px;background:var(--surf2);border-radius:6px;overflow:hidden}
.simprog #simBar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#22c55e);transition:width .12s linear}
.simctrls{display:flex;gap:8px}
.simctrls button{flex:1;padding:9px;border-radius:9px;background:var(--surf2);border:1px solid var(--bdr2);color:var(--txt);font-weight:700;font-size:12px}
.simctrls button:hover{border-color:var(--acc);color:var(--acc)}
.sim-marker div{width:34px;height:34px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 3px 12px rgba(0,180,229,0.6);display:flex;align-items:center;justify-content:center;font-size:17px}
.sim-pin div{font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surf2);border:1px solid var(--acc);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--novo)}

@media(max-width:640px){
  #top{flex-wrap:wrap;gap:10px;padding:10px 12px}
  #top .sub{display:none}
  #board{padding:12px;gap:12px}
  .col{flex-basis:82vw}
}
</style>
</head>
<body>

<!-- LOGIN GATE -->
<div id="gate">
  <div class="card">

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const genId = () => 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2,6);

const FIREBASE_CONFIG = { apiKey:'AIzaSyDTkZHJymDvE2tIn1L961rqEtdJz9zHM8I', databaseURL:'https://vammo-torre-default-rtdb.firebaseio.com' };
const GOOGLE_CLIENT_ID = '907980665919-jigbiqke19b3dbgp1ucu1ibfd8ct28sm.apps.googleusercontent.com';
const BASE_RADIUS_M = 300;         // colab dentro desse raio de uma base = "na base"
const FLEET_VERSION = 'v4 · 2026-08-04';

// Motivos oficiais (mesmos do CX/torre)
const MOTIVOS = [
  'Troca de pneu - roda traseira','Troca de pneu - roda dianteira','Moto não liga - VAMMO',
  'Bateria descarregada','Freio sem resposta','Vazamento de óleo','Acidente',
  'Moto travada no Tracksolution','Deslocamento entre bases','Recolhimento por inadimplência','Devolução de moto'
];

let chamados = {}, motoristas = {}, bases = {}, corridas = {};   // corridas: chamadoId -> ride (tempos/nota)
let currentUser = null, fb = null;
// DEMO (apresentação): chamados fictícios só em memória — NÃO vão pro Firebase,
// não aparecem na torre nem pra outros. Ver plotarDemo()/limparDemo().
let demoOn = false, demoChamados = [];

// ================= TOAST =================
let _tt = null;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err?' err':'');
  clearTimeout(_tt); _tt = setTimeout(()=>t.className='', 3200);
}

// ================= GEO =================
function haversine(a, b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function nearestBase(pos){
  let best=null, bd=Infinity;
  for(const id in bases){ const b=bases[id]; if(!b||b.lat==null||b.lng==null) continue;
    const d=haversine(pos,{lat:b.lat,lng:b.lng}); if(d<bd){ bd=d; best={id,base:b,dist:d}; } }
  return best;
}
function motoristaNaBase(motId){
  const m=motoristas[motId]; if(!m||m.lat==null||m.lng==null) return null;
  const nb=nearestBase({lat:m.lat,lng:m.lng});
  return (nb && nb.dist<=BASE_RADIUS_M) ? nb : null;
}
function motoristaForaDaBase(motId){
  const m=motoristas[motId]; if(!m||m.lat==null||m.lng==null) return false;
  return !motoristaNaBase(motId); // tem posição e NÃO está em nenhuma base = se deslocando
}

// ================= TEMPO =================
function fmtElapsed(ts){
  if(!ts) return '—'; const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'min';
  const h=Math.floor(m/60); return h+'h'+(m%60?(' '+(m%60)+'min'):'');
}
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDataHora(ts){ if(!ts) return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function ehHoje(ts){ if(!ts) return false; const d=new Date(ts), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
const baseNome = id => (bases[id] && bases[id].nome) || id || '';

function icoMotivo(m){
  m=(m||'').toLowerCase();
  if(m.includes('pneu')||m.includes('roda')) return '🛞';
  if(m.includes('não liga')||m.includes('nao liga')||m.includes('bateria')) return '🔋';
  if(m.includes('acidente')) return '🚨';
  if(m.includes('freio')) return '🛑';
  if(m.includes('vazamento')||m.includes('óleo')) return '💧';
  if(m.includes('travada')||m.includes('tracksolution')) return '🔒';
  if(m.includes('deslocamento')||m.includes('transfer')||m.includes('movimenta')) return '🚚';
  if(m.includes('recolhimento')||m.includes('inadimpl')) return '🚛';
  if(m.includes('devolução')||m.includes('devolucao')) return '📦';
  return '🔧';
}
function ehTransf(c){ return !!(c.baseSaida||c.baseEntrega||/deslocamento|movimenta/i.test(c.motivo||'')); }

// ================= ETAPAS =================
// 1 aberto · 2 aceito · 3 atribuído · 4 em rota · 6 concluído  (5 = roster de motoristas na base)
function etapa(c){
  if(c._fakeEtapa) return c._fakeEtapa;   // chamado de demonstração: etapa forçada
  if(c.status==='concluido'||c.status==='cancelado') return 6;
  const hasDriver=!!c.motoristaId, hasTerc=!!c.terceiroId;
  if(hasDriver || hasTerc){
    if(hasDriver && motoristaForaDaBase(c.motoristaId)) return 4;
    return 3;
  }
  if(c.aceitoPor) return 2;
  return 1;
}
// controlador responsável: quem aceitou > quem atribuiu > quem abriu
function controladorDe(c){ return c.aceitoPor || c.atribuidoPor || null; }
function driverDe(c){ return c.motoristaNome || (c.terceiroNome ? c.terceiroNome+' (externo)' : null); }
function corDriver(c){ const m=c.motoristaId&&motoristas[c.motoristaId]; return (m&&m.color) || (c.terceiroId?'#f59e0b':'#00B4E5'); }

const COLS = [
  {n:1, ic:'📢', t:'Aberto',      s:'aguardando a torre aceitar', c:'var(--novo)'},
  {n:2, ic:'✋', t:'Aceito',      s:'controlador assumiu o chamado', c:'var(--aceito)'},
  {n:3, ic:'🧑‍🔧', t:'Atribuído',  s:'motorista designado, na base', c:'var(--atrib)'},
  {n:4, ic:'🚚', t:'Em rota',     s:'motorista se deslocando', c:'var(--rota)'},
  {n:6, ic:'✅', t:'Concluídos',  s:'finalizados hoje', c:'var(--conc)'}
];

// ================= RENDER =================
// A dash do Fleet mostra SÓ os chamados abertos pelo próprio operador logado.
function ehMeuChamado(c){
  if(c && c._fake) return true;
  const meu = (currentUser && currentUser.email || '').toLowerCase();
  return !!meu && (c.abertoPorEmail||'').toLowerCase() === meu;
}
function chamadosVisiveis(){
  const reais = Object.values(chamados).filter(c=>{
    if(!c||!c.id || !ehMeuChamado(c)) return false;
    if(c.status==='concluido'||c.status==='cancelado') return ehHoje(c.concluidoEm||c.ts);
    return true;
  });
  return demoOn ? reais.concat(demoChamados) : reais;
}

function render(){
  const board=$('#board');
  const list=chamadosVisiveis();
  const porEtapa={1:[],2:[],3:[],4:[],6:[]};
  list.forEach(c=>{ const e=etapa(c); (porEtapa[e]=porEtapa[e]||[]).push(c); });
  // ordena por prioridade (aguardando) depois por ts
  for(const k in porEtapa) porEtapa[k].sort((a,b)=> (prioridade(b)-prioridade(a)) || ((a.ts||0)-(b.ts||0)) );

  const ativos=list.filter(c=>c.status!=='concluido'&&c.status!=='cancelado').length;
  $('#statAtivos').textContent=ativos;
  $('#statRota').textContent=(porEtapa[4]||[]).length;

  board.innerHTML = COLS.map(col=>{
    const arr=porEtapa[col.n]||[];
    const inner = arr.length ? arr.map(c=>card(c,col.n)).join('')
      : emptyCol(col.ic, col.n===6?'Nada concluído hoje':'Nenhum chamado aqui');
    return `<div class="col" style="--c:${col.c}">
      <div class="ch"><span class="ci">${col.ic}</span>
        <div><div class="ct">${col.t}</div><div class="cs">${col.s}</div></div>
        <span class="cn">${arr.length}</span>
      </div>
      <div class="body">${inner}</div>
    </div>`;
  }).join('');
  board.querySelectorAll('.kc[data-cid]').forEach(el=> el.onclick=()=> openDetalhe(el.dataset.cid));
}
function emptyCol(e,txt){ return `<div class="empty"><span class="e">${e}</span>${esc(txt)}</div>`; }
function prioridade(c){ return c.clienteAguardando===true ? 1 : 0; }

function card(c, etapaN){
  const num = c.seq!=null ? `<span class="num">#${c.seq}</span>` : '';
  const ctrl = controladorDe(c);
  const drv = driverDe(c);
  const aguard = c.clienteAguardando===true;
  const motos = Array.isArray(c.motos) ? c.motos : null;
  const badges=[];
  if(aguard) badges.push(`<span class="b b-aguard">🙋 AGUARDANDO</span>`);
  if(motos && motos.length) badges.push(`<span class="b" style="background:rgba(0,180,229,0.16);color:var(--acc);border:1px solid rgba(0,180,229,0.4)">🏍 ${motos.length} moto${motos.length>1?'s':''}</span>`);
  if(ehTransf(c)) badges.push(`<span class="b b-transf">🚚 ${esc(baseNome(c.baseSaida)||'?')}→${esc(baseNome(c.baseEntrega)||'?')}</span>`);
  if(motos && motos.some(m=>m.iotForaDaBase)) badges.push(`<span class="b" style="background:#f59e0b;color:#1a1200" title="Uma ou mais motos com IoT fora da base de saída">⚠ moto fora da base</span>`);
  if(c.terceiroId) badges.push(`<span class="b b-ext">🤝 externo</span>`);
  const whoLines=[];
  if(etapaN>=2 && ctrl) whoLines.push(whoLine('👮','Controlador',ctrl,'#00B4E5'));
  if(etapaN>=3 && drv) whoLines.push(whoLine('🛵','Motorista',drv,corDriver(c)));
  const rotaHint = (etapaN===4) ? `<div class="rotahint">🛰 em trajeto · clique pra ${c._fake?'simular':'ver'} no mapa</div>` : '';
  const placasLine = motos && motos.length
    ? `<div class="mv" style="color:var(--txt2);font-family:var(--mono);font-size:10.5px">${motos.map(m=>esc(m.placa)+(m.iotForaDaBase?' ⚠':'')).join(' · ')}</div>` : '';
  const abertoFoot = c.abertoPor
    ? `<div class="aberto">✍ Aberto por <b>${esc(c.abertoPor)}</b> · ${fmtDataHora(c.abertoEm||c.ts)}</div>` : '';
  return `<div class="kc${aguard?' aguard':''}" data-cid="${esc(c.id)}" style="--c:${etapaN===4?'var(--rota)':etapaN===3?'var(--atrib)':etapaN===2?'var(--aceito)':etapaN===6?'var(--conc)':'var(--novo)'}">
    <div class="r1">${num}<span class="cli">${esc(c.cliente||'Sem nome')}</span><span class="ico">${icoMotivo(c.motivo)}</span></div>
    <div class="mv">${esc(c.motivo||'—')}</div>
    ${placasLine}
    ${c.endereco?`<div class="end">📍<span>${esc(c.endereco)}</span></div>`:''}
    ${badges.length?`<div class="badges">${badges.join('')}</div>`:''}
    ${whoLines.length?`<div class="who">${whoLines.join('')}</div>`:''}
    ${rotaHint}
    ${abertoFoot}

const TIPOS = [

const FORA_BASE_M = 800;       // ping a mais que isso da base de saída = "fora da base" (alerta)
const MAX_MOTOS = 30;
let wiz = null;

function clean(o){ const r={}; for(const k in o){ if(o[k]!==undefined&&o[k]!==null) r[k]=o[k]; } return r; }
function baseOpts(sel){

$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

function syncMotosLen(){ const m=wiz.motos; while(m.length<wiz.qtd) m.push({placa:''}); while(m.length>wiz.qtd) m.pop(); }
function podeAbrir(){
  if(!wiz||!wiz.tipo||!wiz.baseSaida||!wiz.baseEntrega||!wiz.motos.length) return false;
  return wiz.motos.every(m => m.placa && ['ok','forabase','iotoff'].includes(m.status));
}
function updateGo(){ const g=$('#wGo'); if(g) g.disabled=!podeAbrir(); }

function renderWizard(){
  const w=wiz;
  const showQty=!!w.tipo, showSaida=showQty, showEntrega=showSaida&&w.baseSaida, showMotos=showEntrega&&w.baseEntrega;
  let h='';

    <div class="wtipo">${TIPOS.map(t=>`<button data-tipo="${t.k}" class="${w.tipo===t.k?'sel':''}"><span class="em">${t.em}</span><div><div class="tt">${t.t}</div><div class="ts">${t.s}</div></div></button>`).join('')}</div></div>`;

  if(showEntrega) h+=`<div class="wsec"><div class="wlabel"><span class="wn">4</span> Base de entrega</div><select id="wEntrega">${baseOpts(w.baseEntrega)}</select>${(w.baseEntrega&&w.baseEntrega===w.baseSaida)?'<div class="mstat warn">⚠ Saída e entrega são a mesma base.</div>':''}</div>`;
  // 5 — placas
  if(showMotos) h+=`<div class="wsec"><div class="wlabel"><span class="wn">5</span> Placas das motos <span style="font-weight:600;text-transform:none;color:var(--txt3);letter-spacing:0">(valida na base + confere IoT)</span></div><div id="wizMotos"></div></div>`;
  // rodapé
  h+=`<div class="mrow"><button class="cancel" onclick="closeModal()">Cancelar</button><button class="go" id="wGo" onclick="abrirMov()" ${podeAbrir()?'':'disabled'}>📢 Abrir movimentação</button></div>`;
  $('#wizBody').innerHTML=h;
  // binds
  document.querySelectorAll('#wizBody [data-tipo]').forEach(b=> b.onclick=()=>{ wiz.tipo=b.dataset.tipo; renderWizard(); });
  { const qm=$('#qminus'); if(qm) qm.onclick=()=>{ wiz.qtd=Math.max(1,wiz.qtd-1); syncMotosLen(); renderWizard(); }; }
  { const qp=$('#qplus'); if(qp) qp.onclick=()=>{ wiz.qtd=Math.min(MAX_MOTOS,wiz.qtd+1); syncMotosLen(); renderWizard(); }; }
  { const s=$('#wSaida'); if(s) s.onchange=()=>{ wiz.baseSaida=s.value; recheckMotos(); renderWizard(); }; }
  { const e=$('#wEntrega'); if(e) e.onchange=()=>{ wiz.baseEntrega=e.value; renderWizard(); }; }
  if(showMotos) renderMotoCards();
}

function statClass(m){ return m.status==='ok'?'ok':(m.status==='forabase'?'warn':(m.status==='notfound'||m.status==='short'?'err':'info')); }
function statText(m){
  switch(m.status){
    case 'checking': return '🔎 verificando placa…';
    case 'notfound': return '✗ placa não encontrada na base Vammo';
    case 'short':    return 'digite a placa completa';
    case 'ok':       return `✓ ${esc(m.modelo||'moto')} · na base de saída`;
    case 'iotoff':   return `✓ ${esc(m.modelo||'moto')} · válida · 📡 IoT offline (localização não confirmada)`;
    case 'forabase': return `⚠ ${esc(m.modelo||'moto')} — FORA da base de saída! 📡 IoT ${m.iotLocal?('perto de '+esc(m.iotLocal)):'em outro local'} (~${(m.iotDist/1000).toFixed(1)}km)`;
    default:         return 'digite a placa da moto';
  }
}
function renderMotoCards(){
  const wrap=$('#wizMotos'); if(!wrap) return;
  wrap.innerHTML = wiz.motos.map((mo,i)=>`
    <div class="moto-card">
      <div class="mh"><span class="mnum">${i+1}</span> Moto ${i+1} de ${wiz.qtd}</div>
      <input id="mp-${i}" placeholder="ABC1D23" maxlength="8" value="${esc(mo.placa||'')}" autocomplete="off" spellcheck="false">
      <div class="mstat ${statClass(mo)}" id="mstat-${i}">${statText(mo)}</div>
    </div>`).join('');
  wiz.motos.forEach((mo,i)=>{
    const inp=$('#mp-'+i);
    inp.addEventListener('change', ()=>{ const v=inp.value.trim().toUpperCase(); inp.value=v; wiz.motos[i]={placa:v}; checkMoto(i); });
  });
}
function updateMotoStat(i){
  const el=$('#mstat-'+i); if(!el) return;
  const m=wiz.motos[i]; el.className='mstat '+statClass(m); el.innerHTML=statText(m);
}
function recheckMotos(){ wiz.motos.forEach((m,i)=>{ if(m.placa) checkMoto(i); }); }

async function checkMoto(i){
  const m=wiz.motos[i]; const placa=(m.placa||'').replace(/[^A-Z0-9]/g,'');
  if(!placa){ m.status='idle'; updateMotoStat(i); updateGo(); return; }
  if(placa.length<6){ m.status='short'; updateMotoStat(i); updateGo(); return; }
  m.status='checking'; updateMotoStat(i); updateGo();
  try{
    const d=await (await fetch('/api/moto_lookup?placa='+encodeURIComponent(placa))).json();
    if(!d||!d.found){ m.status='notfound'; updateMotoStat(i); updateGo(); return; }
    m.found=true; m.modelo=d.modelo||'moto'; m.clienteMoto=d.cliente||null;
    // IoT: só alerta se online (offline é desconsiderado)
    let status='iotoff';
    try{
      const ij=await (await fetch('/iot_status?placas='+encodeURIComponent(placa))).json();
      const ping=ij.pings && ij.pings[placa];
      if(ping && ping.online && ping.lat!=null && ping.lon!=null){
        const bs=bases[wiz.baseSaida];
        if(bs && bs.lat!=null && bs.lng!=null){
          const dist=haversine({lat:bs.lat,lng:bs.lng},{lat:ping.lat,lng:ping.lon});
          const nb=nearestBase({lat:ping.lat,lng:ping.lon});
          m.iotDist=dist; m.iotLocal = nb ? nb.base.nome : null;
          status = dist>FORA_BASE_M ? 'forabase' : 'ok';
        } else { status='iotoff'; }   // base sem coordenada: não dá pra conferir
      }
    }catch(_){ status='iotoff'; }
    m.status=status;
  }catch(e){ m.status='notfound'; }
  updateMotoStat(i); updateGo();
}

async function abrirMov(){
  if(!podeAbrir()) return;
  const w=wiz, nS=baseNome(w.baseSaida), nE=baseNome(w.baseEntrega);
  const fora=w.motos.filter(m=>m.status==='forabase');
  if(fora.length && !confirm(`⚠ ${fora.length} moto(s) com IoT FORA da base de saída (${nS}):\n`+
    fora.map(m=>`• ${m.placa} — ${m.iotLocal||'outro local'} (~${(m.iotDist/1000).toFixed(1)}km)`).join('\n')+
    `\n\nA moto provavelmente não está na base. Abrir mesmo assim?`)) return;
  const g=$('#wGo'); g.disabled=true; g.textContent='⏳ Abrindo…';
  const bs=bases[w.baseSaida]||{};
  const ch={
    id:genId(), ts:Date.now(),
    tipoMovimentacao:w.tipo, motivo:tipoLabel(w.tipo),
    cliente:`${nS} → ${nE} · ${w.qtd} moto${w.qtd>1?'s':''}`,
    qtdMotos:w.qtd, baseSaida:w.baseSaida, baseEntrega:w.baseEntrega,
    motos:w.motos.map(m=>clean({ placa:m.placa, modelo:m.modelo||null,
      iotForaDaBase:m.status==='forabase'?true:null, iotDistM:m.iotDist!=null?Math.round(m.iotDist):null,
      iotLocal:m.iotLocal||null, iotOffline:m.status==='iotoff'?true:null })),
    placa:w.motos.map(m=>m.placa).join(', ').slice(0,80),
    endereco:bs.endereco||bs.nome||nS, lat:(bs.lat!=null?bs.lat:null), lng:(bs.lng!=null?bs.lng:null),
    status:'novo', clienteAguardando:false, origemFleet:true,
    abertoPor:currentUser.nome, abertoPorEmail:currentUser.email, abertoEm:Date.now()
  };
  try{
    await new Promise(res=>{ try{ fb.child('counters/chamadoSeq').transaction(n=>(n||0)+1,(e,ok,s)=>{ if(ok&&s&&s.val()!=null) ch.seq=s.val(); res(); }); }catch(_){ res(); } });
    await fb.child('chamados/'+ch.id).set(clean(ch));
    toast(`📢 Movimentação #${ch.seq||''} aberta na Torre!`);
    closeModal();
  }catch(err){ toast('❌ erro ao abrir: '+err.message, true); g.disabled=false; g.textContent='📢 Abrir movimentação'; }
}

// ================= SIMULADOR DE ROTA (demo — motorista em rota no mapa) =================
let _leaflet=false;
async function ensureLeaflet(){
  if(_leaflet && window.L) return;
  if(!document.querySelector('link[data-lf]')){ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; l.setAttribute('data-lf','1'); document.head.appendChild(l); }
  if(!window.L) await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  _leaflet=true;
}
let sim={ map:null, timer:null, coords:[], idx:0, marker:null, playing:false, durMs:34000, routeMin:0 };
async function openSimulador(id){
  const c=findChamado(id); if(!c) return;
  const from=c._simFrom||(c.baseSaida&&bases[c.baseSaida]&&bases[c.baseSaida].lat!=null?{lat:bases[c.baseSaida].lat,lng:bases[c.baseSaida].lng}:null);
  const to  =c._simTo  ||(c.baseEntrega&&bases[c.baseEntrega]&&bases[c.baseEntrega].lat!=null?{lat:bases[c.baseEntrega].lat,lng:bases[c.baseEntrega].lng}:null);
  if(!from||!to){ toast('Sem coordenadas das bases pra simular', true); return; }
  closeDetalhe();
  $('#sim').classList.add('on');
  $('#simTitle').textContent = `${baseNome(c.baseSaida)} → ${baseNome(c.baseEntrega)}`;
  $('#simSub').textContent='carregando rota…';
  $('#simDriverN').textContent = driverDe(c)||'Motorista';
  await ensureLeaflet();
  await simInit(from, to);
}
async function simInit(from, to){
  simStop();
  if(sim.map){ sim.map.remove(); sim.map=null; }
  sim.map = L.map($('#simMap'), {zoomControl:true, attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(sim.map);
  const pin=(emoji)=>L.divIcon({className:'sim-pin', html:`<div>${emoji}</div>`, iconSize:[26,26], iconAnchor:[13,24]});
  L.marker([from.lat,from.lng], {icon:pin('🏁')}).addTo(sim.map);
  L.marker([to.lat,to.lng], {icon:pin('🎯')}).addTo(sim.map);
  let coords=[[from.lat,from.lng],[to.lat,to.lng]], mins=0, real=false;
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
    const d=await (await fetch(u)).json();
    const rt=d.routes&&d.routes[0];
    if(rt && rt.geometry){ coords=rt.geometry.coordinates.map(p=>[p[1],p[0]]); mins=Math.round(rt.duration/60); real=true; }
  }catch(_){}
  sim.coords=coords; sim.routeMin=mins; sim.idx=0;
  L.polyline(coords, {color:'#00B4E5', weight:5, opacity:.85, dashArray:'10,8'}).addTo(sim.map);
  sim.marker = L.marker(coords[0], {icon:L.divIcon({className:'sim-marker', html:'<div>🛵</div>', iconSize:[34,34], iconAnchor:[17,17]}), zIndexOffset:1000}).addTo(sim.map);
  sim.map.fitBounds(L.latLngBounds(coords).pad(0.15));
  setTimeout(()=>{ if(sim.map) sim.map.invalidateSize(); }, 80);
  $('#simSub').textContent = `${real?'trajeto real (OSRM)':'linha reta'} · ETA ~${mins||'—'} min`;
  simPlay();
}
function simRender(){
  const n=sim.coords.length; if(!n) return;
  const pos=sim.coords[Math.min(Math.floor(sim.idx),n-1)];
  if(sim.marker&&pos) sim.marker.setLatLng(pos);
  const prog=n>1?Math.min(1, sim.idx/(n-1)):1;
  $('#simBar').style.width=(prog*100).toFixed(1)+'%';
  $('#simEta').textContent = prog>=1 ? '✓ chegou no destino' : `ETA ~${Math.max(0,Math.round(sim.routeMin*(1-prog)))} min · ${Math.round(prog*100)}%`;
}
function simStep(){
  const n=sim.coords.length; if(n<2) return;
  sim.idx += n/(sim.durMs/120);
  if(sim.idx>=n-1){ sim.idx=n-1; simRender(); simStop(); sim.playing=false; $('#simPlay').textContent='↺ Refazer'; return; }
  simRender();
}
function simStop(){ if(sim.timer){ clearInterval(sim.timer); sim.timer=null; } }
function simPlay(){ simStop(); if(sim.idx>=sim.coords.length-1) sim.idx=0; sim.playing=true; $('#simPlay').textContent='⏸ Pausar'; sim.timer=setInterval(simStep,120); simRender(); }
function simTogglePlay(){ if(sim.playing){ simStop(); sim.playing=false; $('#simPlay').textContent='▶ Continuar'; } else { simPlay(); } }
function simRestart(){ sim.idx=0; simPlay(); }
function closeSimulador(){ simStop(); $('#sim').classList.remove('on'); if(sim.map){ sim.map.remove(); sim.map=null; } }
$('#sim').addEventListener('click', e=>{ if(e.target.id==='sim') closeSimulador(); });

// ================= AUTH (Google @vammo.com) =================
function parseJwt(t){
  try{ return JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); }
  catch(_){ return null; }
}
function entrar(u){
  currentUser=u; localStorage.setItem('fleet_user', JSON.stringify(u));
  $('#gate').style.display='none';
  const uc=$('#userchip'); uc.style.display='flex';
  uc.innerHTML=`${u.picture?`<img src="${esc(u.picture)}" referrerpolicy="no-referrer">`:''}<span class="un">${esc((u.nome||u.email).split(' ')[0])}</span><button class="lo" title="Sair" onclick="sair()">⏻</button>`;
  initFirebase().catch(e=>{ console.error(e); toast('Erro ao conectar ao Firebase', true); });
}
function sair(){ localStorage.removeItem('fleet_user'); location.reload(); }
function onCredential(resp){
  const p=parseJwt(resp.credential);
  if(!p||!p.email){ $('#gerr').textContent='Não consegui ler a conta. Tente de novo.'; return; }
  if(!/@vammo\.com$/i.test(p.email)){ $('#gerr').textContent='Use uma conta @vammo.com para acessar.'; return; }
  entrar({ email:p.email, nome:p.name||p.email, picture:p.picture||'' });
}
function initAuth(){
  const saved=(()=>{ try{ return JSON.parse(localStorage.getItem('fleet_user')||'null'); }catch(_){ return null; } })();
  if(saved && saved.email && /@vammo\.com$/i.test(saved.email)){ entrar(saved); return; }
  loadScript('https://accounts.google.com/gsi/client').then(()=>{
    try{
      google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:onCredential });
      google.accounts.id.renderButton($('#gbtn'), { theme:'filled_blue', size:'large', text:'signin_with', shape:'pill', width:280 });
      google.accounts.id.prompt();
    }catch(e){ $('#gerr').textContent='Falha ao carregar o login do Google.'; }
  }).catch(()=>{ $('#gerr').textContent='Sem conexão com o login do Google.'; });
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeSimulador(); closeDetalhe(); closeModal(); } });
initAuth();
console.log('Vammo Fleet', FLEET_VERSION);
</script>
