<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vammo · Central de Fleet</title>
<link rel="icon" href="/icon-192.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="/fleet-intro.jpg">
<style>
:root{
  --acc:#00B4E5; --acc-br:#3CCDF6;
  --txt:#EAF2FB; --txt2:#AEC0D8; --txt3:#8195B0;
  --novo:#FF5C79; --aceito:#FFB020; --atrib:#A78BFA; --rota:#3CCDF6; --conc:#34D399;
  --bdr:rgba(255,255,255,.10); --bdr2:rgba(255,255,255,.17);
  --glass:rgba(16,31,55,.50); --glass2:rgba(9,20,40,.28); --glassmod:rgba(13,25,46,.92);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --sh-sm:0 2px 8px rgba(0,0,0,.24);
  --sh-md:0 12px 34px rgba(0,0,0,.38);
  --sh-lg:0 30px 74px rgba(0,0,0,.58);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--txt);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:
    linear-gradient(180deg, rgba(6,14,26,.60), rgba(3,9,18,.85)),
    url('/fleet-intro.jpg') center/cover no-repeat fixed,
    #06101d;}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.30);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== INTRO SPLASH ===== */
#intro{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(700px 470px at 50% 46%, rgba(2,8,16,.48), transparent 72%),
    linear-gradient(180deg, rgba(4,14,26,.42), rgba(3,9,17,.82)),
    url('/fleet-intro.jpg') center/cover no-repeat,
    radial-gradient(1200px 760px at 50% 34%, #0d3a52, #061019 72%);
  opacity:1;transition:opacity .6s ease}
#intro.done{opacity:0;pointer-events:none}
#intro .glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle, rgba(0,180,229,.4), transparent 62%);filter:blur(28px);animation:introGlow 2.6s ease-in-out infinite}
@keyframes introGlow{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.1);opacity:1}}
.intro-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px}
.intro-logo{color:#fff;line-height:0;opacity:0;transform:scale(.82) translateY(8px);animation:introLogo .95s cubic-bezier(.2,.85,.25,1) .12s forwards}
.intro-logo svg{width:min(58vw,240px);height:auto;filter:drop-shadow(0 8px 34px rgba(0,180,229,.55))}
@keyframes introLogo{to{opacity:1;transform:none}}
.intro-word{display:flex;align-items:center;font-family:var(--sans);font-weight:800;font-size:clamp(15px,4.4vw,23px);letter-spacing:4px;text-transform:uppercase;height:26px}
.intro-word span{opacity:0;transform:translateY(12px);display:inline-block;color:#cfe9f5;animation:introLetter .55s cubic-bezier(.2,.85,.25,1) forwards}
.intro-word span.hl{color:#3CCDF6;text-shadow:0 0 18px rgba(0,180,229,.6)}
.intro-word span.sp{width:.55em}
@keyframes introLetter{to{opacity:1;transform:none}}
.intro-line{height:2px;width:0;background:linear-gradient(90deg,transparent,#3CCDF6,transparent);margin-top:2px;animation:introLine .8s ease 1.35s forwards}
@keyframes introLine{to{width:min(58vw,240px)}}

/* ===== HEADER ===== */
#top{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:12px 22px;background:rgba(8,18,34,.55);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--bdr);box-shadow:0 6px 26px rgba(0,0,0,.32);z-index:20}
#top .logo{color:var(--acc);line-height:0;flex:0 0 auto}
#top .logo svg{width:96px;height:auto;display:block;filter:drop-shadow(0 0 12px rgba(0,180,229,.4))}
#top .sub{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--txt3);border-left:1.5px solid var(--bdr2);padding-left:16px}
#top .sub b{color:#fff;font-weight:800}
#top .spacer{flex:1}
#top .stat{display:flex;gap:9px;align-items:center}
#top .stat>span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);border-radius:11px;padding:6px 11px;font-size:11px;font-weight:600;color:var(--txt2)}
#top .stat b{color:#fff;font-size:14px;font-family:var(--mono);font-weight:700}
#syncdot{width:8px;height:8px;border-radius:50%;background:var(--aceito);box-shadow:0 0 0 3px rgba(255,176,32,.18),0 0 8px var(--aceito);display:inline-block}
#syncdot.on{background:var(--conc);box-shadow:0 0 0 3px rgba(52,211,153,.18),0 0 8px var(--conc)}
.btn-open{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#12C4F5,#0098CC);color:#fff;font-weight:700;font-size:13px;padding:10px 17px;border-radius:12px;box-shadow:0 6px 20px rgba(0,180,229,.42),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,box-shadow .12s;letter-spacing:.2px}
.btn-open:hover{transform:translateY(-1.5px);box-shadow:0 11px 28px rgba(0,180,229,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-open:active{transform:translateY(0)}
.btn-demo{background:rgba(255,255,255,.06);border:1px solid var(--bdr2);color:var(--txt2);font-weight:700;font-size:11.5px;padding:8px 12px;border-radius:11px;transition:.12s;white-space:nowrap}
.btn-demo:hover{border-color:var(--acc);color:var(--acc-br)}
.btn-demo.on{background:rgba(255,176,32,.16);border-color:var(--aceito);color:#FFC969}
#userchip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);border-radius:22px;padding:4px 6px 4px 4px}
#userchip img{width:28px;height:28px;border-radius:50%}
#userchip .un{font-size:12px;font-weight:700;color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#userchip .lo{background:transparent;border:none;color:var(--txt3);font-size:14px;padding:0 5px}
#userchip .lo:hover{color:var(--novo)}

/* ===== BOARD ===== */
#board{flex:1;min-height:0;display:flex;gap:16px;padding:20px 22px;overflow-x:auto;overflow-y:hidden;align-items:stretch}
.col{flex:0 0 308px;display:flex;flex-direction:column;min-height:0;background:var(--glass2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--bdr);border-radius:18px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.26)}
.col .ch{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 15px;border-bottom:1px solid var(--bdr);
  background:rgba(14,28,50,.5);background:color-mix(in srgb, var(--c) 20%, rgba(10,22,42,.42));
  border-bottom-color:color-mix(in srgb, var(--c) 30%, var(--bdr))}
.col .ch .ci{font-size:17px}
.col .ch .ct{font-weight:800;font-size:13px;color:#fff;letter-spacing:.1px}
.col .ch .cs{font-size:9.5px;color:var(--txt2);font-weight:600;margin-top:1px;line-height:1.25;opacity:.92}
.col .ch .cn{margin-left:auto;background:var(--c);color:#08121c;font-weight:800;font-size:12px;font-family:var(--mono);min-width:26px;text-align:center;padding:4px 9px;border-radius:20px;box-shadow:0 0 14px -3px var(--c)}
.col .body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:11px}
.col .empty{margin:auto;text-align:center;color:var(--txt3);font-size:11.5px;padding:26px 12px;line-height:1.55}
.col .empty .e{font-size:32px;opacity:.32;display:block;margin-bottom:8px}

/* ===== CARD (glass) ===== */
.kc{background:var(--glass);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--bdr);border-radius:16px;padding:13px 14px;cursor:pointer;color:var(--txt);box-shadow:0 8px 26px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .14s ease,box-shadow .14s ease,border-color .14s}
.kc:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 60%, var(--bdr));box-shadow:0 16px 42px rgba(0,0,0,.44),0 0 26px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.09)}
.kc.aguard{border-color:color-mix(in srgb,#34D399 55%, var(--bdr));box-shadow:0 8px 26px rgba(0,0,0,.30),0 0 22px -9px #34D399,inset 0 1px 0 rgba(255,255,255,.06)}
.kc .r1{display:flex;align-items:center;gap:8px}
.kc .num{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--c);background:rgba(255,255,255,.08);background:color-mix(in srgb,var(--c) 20%, transparent);border:1px solid color-mix(in srgb,var(--c) 32%, transparent);padding:2px 7px;border-radius:7px}
.kc .cli{font-weight:800;font-size:14px;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
.kc .ico{font-size:16px;opacity:.92}
.kc .mv{font-size:11.5px;color:var(--txt2);margin-top:6px;line-height:1.35;font-weight:500}
.kc .end{font-size:10.5px;color:var(--txt3);margin-top:4px;line-height:1.3;display:flex;gap:4px;font-weight:500}
.kc .end span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--txt3);font-family:var(--mono);margin-top:9px;font-weight:600}
.kc .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.kc .b{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.1px;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--txt2);border:1px solid var(--bdr)}
.b-moto{background:rgba(0,180,229,.16);color:#8FE0F7;border-color:rgba(0,180,229,.38)}
.b-aguard{background:#10B981;color:#04160f;border-color:#10B981;box-shadow:0 2px 12px rgba(16,185,129,.42)}
.b-transf{background:rgba(167,139,250,.18);color:#CDBBFB;border-color:rgba(167,139,250,.38)}
.b-ext{background:rgba(255,176,32,.16);color:#FFCB6B;border-color:rgba(255,176,32,.38)}
.b-warn{background:rgba(255,176,32,.16);color:#FFCB6B;border-color:rgba(255,176,32,.38)}
.kc .who{display:flex;flex-direction:column;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--bdr)}
.kc .wl{display:flex;align-items:center;gap:9px}
.kc .wl .av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 26px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.kc .wl .wi{min-width:0}
.kc .wl .wr{font-size:8.5px;color:var(--txt3);font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:1}
.kc .wl .wn{font-size:12.5px;font-weight:700;color:#fff;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.kc .rotahint{margin-top:11px;padding:8px;text-align:center;background:rgba(0,180,229,.13);border:1px solid rgba(0,180,229,.4);color:#8FE0F7;font-weight:700;font-size:10.5px;border-radius:9px}
.kc .aberto{font-size:9.5px;color:var(--txt3);margin-top:10px;padding-top:9px;border-top:1px solid var(--bdr);line-height:1.35;font-weight:500}
.kc .aberto b{color:var(--txt2);font-weight:700}

/* ===== LOGIN GATE ===== */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg, rgba(6,14,26,.58), rgba(3,9,18,.84)),url('/fleet-intro.jpg') center/cover no-repeat}
#gate .card{background:var(--glassmod);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--bdr2);border-radius:24px;padding:42px 34px;max-width:400px;width:100%;text-align:center;box-shadow:var(--sh-lg)}
#gate .lg{color:var(--acc);line-height:0}
#gate .lg svg{width:150px;height:auto;margin:0 auto 2px;display:block;filter:drop-shadow(0 0 16px rgba(0,180,229,.45))}
#gate .sub{font-size:12px;color:var(--txt3);font-weight:800;letter-spacing:2.5px;text-transform:uppercase;margin:8px 0 20px}
#gate .txt{font-size:13.5px;color:var(--txt2);margin-bottom:24px;line-height:1.55}
#gbtn{display:flex;justify-content:center;min-height:44px}
#gerr{font-size:12px;color:var(--novo);margin-top:14px;min-height:16px;line-height:1.4;font-weight:600}

/* ===== MODAIS (base glass) ===== */
#modal,#det,#sim{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,8,16,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal{z-index:90}#det{z-index:95}#sim{z-index:110}
#modal.on,#det.on,#sim.on{display:flex}
#modal .m,#det .m{background:var(--glassmod);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--bdr2);border-radius:20px;width:460px;max-width:94vw;max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--sh-lg);color:var(--txt);animation:modalIn .22s cubic-bezier(.2,.8,.25,1)}
#det .m{width:450px}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.mx{background:transparent;border:none;color:var(--txt3);font-size:20px;line-height:1;padding:2px 6px;border-radius:8px}
.mx:hover{color:#fff;background:rgba(255,255,255,.08)}
#modal h2,#det h2{font-size:18px;color:#fff;line-height:1.25;letter-spacing:-.2px}
#modal .msub{font-size:12px;color:var(--txt2);margin-bottom:4px;line-height:1.4}
#modal label{display:block;font-size:11px;color:var(--txt2);font-weight:700;margin:12px 0 5px}
#modal input,#modal select,#modal textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bdr2);color:#fff;border-radius:10px;padding:11px 13px;font-size:13px;font-family:inherit;transition:.12s}
#modal select option{background:#0e1c34;color:#fff}
#modal input:focus,#modal select:focus,#modal textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,180,229,.2);background:rgba(255,255,255,.09)}
.mrow{display:flex;gap:8px;margin-top:20px}
.mrow button{flex:1;padding:12px;border-radius:11px;font-weight:800;font-size:13px}
.mrow .cancel{flex:0 0 34%;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);color:var(--txt2)}
.mrow .cancel:hover{border-color:var(--txt3);color:#fff}
.mrow .go{background:linear-gradient(135deg,#12C4F5,#0098CC);color:#fff;box-shadow:0 6px 18px rgba(0,180,229,.4)}
.mrow .go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.wsec{margin-top:18px;animation:wfade .2s ease}
@keyframes wfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.wlabel{font-size:11px;color:var(--txt2);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.wlabel .wn{background:linear-gradient(135deg,#12C4F5,#0098CC);color:#fff;width:19px;height:19px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 19px}
.wtipo{display:flex;flex-direction:column;gap:8px}
.wtipo button{display:flex;align-items:center;gap:12px;padding:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--bdr2);border-radius:12px;text-align:left;color:var(--txt);width:100%;transition:.12s}
.wtipo button:hover{border-color:var(--acc);background:rgba(0,180,229,.08)}
.wtipo button.sel{border-color:var(--acc);background:rgba(0,180,229,.16);box-shadow:0 0 0 3px rgba(0,180,229,.15)}
.wtipo .em{font-size:23px;flex:0 0 auto}
.wtipo .tt{font-weight:800;font-size:13px;color:#fff}
.wtipo .ts{font-size:10.5px;color:var(--txt2);font-weight:600}
.wqty{display:flex;align-items:center;gap:14px}
.wqty button{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--bdr2);color:var(--acc-br);font-size:24px;font-weight:800;line-height:1;transition:.12s}
.wqty button:hover{border-color:var(--acc);background:rgba(0,180,229,.1)}
.wqty .qn{font-size:32px;font-weight:800;font-family:var(--mono);min-width:54px;text-align:center;color:#fff}
.moto-card{background:rgba(255,255,255,.05);border:1px solid var(--bdr2);border-radius:12px;padding:12px;margin-top:9px}
.moto-card .mh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;font-weight:800;color:var(--txt2)}
.moto-card .mnum{background:var(--atrib);color:#1a1230;width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 20px}
.moto-card input{text-transform:uppercase;font-family:var(--mono);letter-spacing:2px;font-weight:800;font-size:16px;text-align:center}
.mstat{font-size:11px;margin-top:7px;line-height:1.4;min-height:15px;font-weight:600}
.mstat.ok{color:#34D399}
.mstat.warn{color:#FFB020}
.mstat.err{color:#FF6B85}
.mstat.info{color:var(--txt2)}
/* autocomplete de placa */
.acwrap{position:relative}
.acdd{position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:6;background:var(--glassmod);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--bdr2);border-radius:12px;box-shadow:var(--sh-md);overflow:hidden auto;display:none;max-height:240px}
.acdd.on{display:block}
.acitem{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06)}
.acitem:last-child{border-bottom:none}
.acitem:hover{background:rgba(0,180,229,.16)}
.acpl{font-family:var(--mono);font-weight:800;color:#fff;font-size:13px;letter-spacing:1px}
.acmo{font-size:10.5px;color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acempty{padding:11px;font-size:11px;color:var(--txt3)}
/* tag de status da moto no sistema */
.mstag{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;margin-right:6px;vertical-align:middle}
.mstag.ok{background:rgba(52,211,153,.18);color:#5FE0B0;border:1px solid rgba(52,211,153,.4)}
.mstag.info{background:rgba(0,180,229,.16);color:#8FE0F7;border:1px solid rgba(0,180,229,.36)}
.mstag.warn{background:rgba(255,176,32,.16);color:#FFCB6B;border:1px solid rgba(255,176,32,.38)}
.mstag.err{background:rgba(255,92,121,.16);color:#FF9DAC;border:1px solid rgba(255,92,121,.4)}
.mstag.muted{background:rgba(255,255,255,.08);color:var(--txt2);border:1px solid var(--bdr)}
/* remover placa + adicionar placa */
.moto-card .mrm{margin-left:auto;background:transparent;border:none;color:var(--txt3);font-size:12px;cursor:pointer;padding:2px 7px;border-radius:6px;line-height:1}
.moto-card .mrm:hover{color:var(--novo);background:rgba(255,92,121,.14)}
.wadd{width:100%;margin-top:10px;padding:11px;background:rgba(0,180,229,.10);border:1px dashed rgba(0,180,229,.45);color:var(--acc-br);font-weight:700;font-size:12.5px;border-radius:11px;transition:.12s}
.wadd:hover{background:rgba(0,180,229,.17);border-style:solid}

/* ===== DETALHE / HISTÓRICO ===== */
.deth{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px}
.deth h2{font-size:16px;line-height:1.25}
.det-chip{display:inline-block;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;margin-top:8px;box-shadow:0 0 14px -4px currentColor}
.det-sec{margin-top:18px}
.det-sec .st{font-size:10px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.det-total{display:flex;align-items:center;justify-content:space-between;background:rgba(0,180,229,.12);border:1px solid rgba(0,180,229,.32);border-radius:13px;padding:13px 15px;margin-top:14px}
.det-total .tl{font-size:11.5px;color:var(--txt2);font-weight:700}
.det-total .tv{font-size:23px;font-weight:800;font-family:var(--mono);color:#8FE0F7}
.tl-row{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-row:last-child{padding-bottom:0}
.tl-row .tl-ic{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;box-shadow:0 0 12px -2px rgba(0,180,229,.5)}
.tl-row::before{content:'';position:absolute;left:15px;top:32px;bottom:-2px;width:2px;background:var(--bdr2)}
.tl-row:last-child::before{display:none}
.tl-bd{flex:1;padding-top:4px}
.tl-bd .tl-l{font-size:12.5px;font-weight:700;color:#fff}
.tl-bd .tl-t{font-size:10.5px;color:var(--txt3);font-family:var(--mono);margin-top:2px}
.tl-dur{margin-left:auto;font-size:11px;font-weight:800;font-family:var(--mono);color:#8FE0F7;background:rgba(0,180,229,.14);padding:3px 9px;border-radius:8px;height:fit-content;align-self:center}
.det-motos{display:flex;flex-direction:column;gap:6px}
.det-moto{display:flex;align-items:center;gap:9px;font-size:12px;background:rgba(255,255,255,.05);border:1px solid var(--bdr);border-radius:9px;padding:8px 10px}
.det-moto .pl{font-family:var(--mono);font-weight:800;color:#fff}
.det-moto .mo{color:var(--txt2);font-size:10.5px}
.det-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:16px;padding:13px;background:linear-gradient(135deg,#12C4F5,#0098CC);color:#fff;font-weight:800;font-size:13px;border-radius:12px;text-decoration:none;box-shadow:0 6px 18px rgba(0,180,229,.4)}
.det-btn:hover{transform:translateY(-1px)}
.det-nota{display:inline-flex;align-items:center;gap:5px;background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.4);color:#5FE0B0;font-weight:800;font-size:12px;padding:5px 11px;border-radius:20px}

/* ===== SIMULADOR ===== */
.simcard{background:var(--glassmod);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--bdr2);border-radius:20px;width:640px;max-width:96vw;max-height:94vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-lg);animation:modalIn .22s cubic-bezier(.2,.8,.25,1)}
.simhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--bdr)}
.simt{font-size:15px;font-weight:800;color:#fff}
.simsub{font-size:11px;color:var(--txt2);margin-top:2px}
#simMap{height:min(56vh,440px);width:100%;background:#0a1428}
.leaflet-container{background:#0a1428 !important;font-family:var(--sans)}
.simfoot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:11px}
.simstat{font-size:12.5px;font-weight:700;color:#fff}
.simstat #simEta{color:#8FE0F7}
.simprog{height:8px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.simprog #simBar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#34D399);transition:width .12s linear}
.simctrls{display:flex;gap:8px}
.simctrls button{flex:1;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--bdr2);color:var(--txt);font-weight:700;font-size:12px}
.simctrls button:hover{border-color:var(--acc);color:var(--acc-br)}
.sim-marker div{width:34px;height:34px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 3px 14px rgba(0,180,229,.7);display:flex;align-items:center;justify-content:center;font-size:17px}
.sim-pin div{font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--glassmod);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bdr2);color:#fff;padding:12px 18px;border-radius:13px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:130;max-width:90vw;border-left:4px solid var(--acc)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-left-color:var(--novo)}

@media(max-width:640px){
  #top{flex-wrap:wrap;gap:10px;padding:10px 12px}
  #top .sub{display:none}
  #board{padding:12px;gap:12px}
  .col{flex-basis:84vw}
}

let _tt = null;
function toast(msg, err){

  clearTimeout(_tt); _tt = setTimeout(()=>t.className='', 3200);
}

// ================= GEO =================
function haversine(a, b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function nearestBase(pos){
  let best=null, bd=Infinity;
  for(const id in bases){ const b=bases[id]; if(!b||b.lat==null||b.lng==null) continue;
    const d=haversine(pos,{lat:b.lat,lng:b.lng}); if(d<bd){ bd=d; best={id,base:b,dist:d}; } }
  return best;
}
function motoristaNaBase(motId){
  const m=motoristas[motId]; if(!m||m.lat==null||m.lng==null) return null;
  const nb=nearestBase({lat:m.lat,lng:m.lng});
  return (nb && nb.dist<=BASE_RADIUS_M) ? nb : null;
}
function motoristaForaDaBase(motId){
  const m=motoristas[motId]; if(!m||m.lat==null||m.lng==null) return false;
  return !motoristaNaBase(motId); // tem posição e NÃO está em nenhuma base = se deslocando
}

// ================= TEMPO =================
function fmtElapsed(ts){
  if(!ts) return '—'; const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'min';
  const h=Math.floor(m/60); return h+'h'+(m%60?(' '+(m%60)+'min'):'');
}
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDataHora(ts){ if(!ts) return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function ehHoje(ts){ if(!ts) return false; const d=new Date(ts), n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
const baseNome = id => (bases[id] && bases[id].nome) || id || '';

function icoMotivo(m){
  m=(m||'').toLowerCase();
  if(m.includes('pneu')||m.includes('roda')) return '🛞';
  if(m.includes('não liga')||m.includes('nao liga')||m.includes('bateria')) return '🔋';
  if(m.includes('acidente')) return '🚨';
  if(m.includes('freio')) return '🛑';
  if(m.includes('vazamento')||m.includes('óleo')) return '💧';
  if(m.includes('travada')||m.includes('tracksolution')) return '🔒';
  if(m.includes('deslocamento')||m.includes('transfer')||m.includes('movimenta')) return '🚚';
  if(m.includes('recolhimento')||m.includes('inadimpl')) return '🚛';
  if(m.includes('devolução')||m.includes('devolucao')) return '📦';
  return '🔧';
}
function ehTransf(c){ return !!(c.baseSaida||c.baseEntrega||/deslocamento|movimenta/i.test(c.motivo||'')); }

// ================= ETAPAS =================
// 1 aberto · 2 aceito · 3 atribuído · 4 em rota · 6 concluído  (5 = roster de motoristas na base)
function etapa(c){
  if(c._fakeEtapa) return c._fakeEtapa;   // chamado de demonstração: etapa forçada
  if(c.status==='concluido'||c.status==='cancelado') return 6;
  if(ehTransf(c) && (c.descargaEm||c.descargaBaseNome)) return 6;   // transferência ENTREGUE (descarregada na base) → coluna final
  const hasDriver=!!c.motoristaId, hasTerc=!!c.terceiroId;
  if(hasDriver || hasTerc){
    if(hasDriver && motoristaForaDaBase(c.motoristaId)) return 4;
    return 3;
  }
  if(c.aceitoPor) return 2;
  return 1;
}
// controlador responsável: quem aceitou > quem atribuiu > quem abriu
function controladorDe(c){ return c.aceitoPor || c.atribuidoPor || null; }
function driverDe(c){ return c.motoristaNome || (c.terceiroNome ? c.terceiroNome+' (externo)' : null); }
function corDriver(c){ const m=c.motoristaId&&motoristas[c.motoristaId]; return (m&&m.color) || (c.terceiroId?'#f59e0b':'#00B4E5'); }

// ================= RENDER =================
// A dash do Fleet mostra SÓ os chamados abertos pelo próprio operador logado.
function ehMeuChamado(c){
  if(c && c._fake) return true;
  const meu = (currentUser && currentUser.email || '').toLowerCase();
  return !!meu && (c.abertoPorEmail||'').toLowerCase() === meu;
}
function chamadosVisiveis(){
  const reais = Object.values(chamados).filter(c=>{
    if(!c||!c.id) return false;
    // BOARD DE TIME: o Fleet mostra os chamados de TODOS os operadores (não filtra por quem abriu).
    // SEPARAÇÃO Fleet×CX: só movimentação/Fleet (nunca socorro do CX).
    if(!c._fake && !(c.origemFleet || (ehTransf(c) && !c.origemCX))) return false;
    if(c.status==='concluido'||c.status==='cancelado') return ehHoje(c.concluidoEm||c.ts);
    return true;
  });
  return demoOn ? reais.concat(demoChamados) : reais;
}

let _renderTimer=null;
function scheduleRender(){ if(_renderTimer) return; _renderTimer=setTimeout(()=>{ _renderTimer=null; render(); }, 80); }
function render(){
  const board=$('#board');
  const list=chamadosVisiveis();
  const porEtapa={1:[],2:[],3:[],4:[],6:[]};
  list.forEach(c=>{ const e=etapa(c); (porEtapa[e]=porEtapa[e]||[]).push(c); });
  // ordena por prioridade (aguardando) depois por ts
  for(const k in porEtapa) porEtapa[k].sort((a,b)=> (prioridade(b)-prioridade(a)) || ((a.ts||0)-(b.ts||0)) );

  const ativos=list.filter(c=>c.status!=='concluido'&&c.status!=='cancelado').length;
  $('#statAtivos').textContent=ativos;
  $('#statRota').textContent=(porEtapa[4]||[]).length;

  board.innerHTML = COLS.map(col=>{
    const arr=porEtapa[col.n]||[];
    const inner = arr.length ? arr.map(c=>card(c,col.n)).join('')
      : emptyCol(col.ic, col.n===6?'Nada concluído hoje':'Nenhum chamado aqui');
    return `<div class="col" style="--c:${col.c}">
      <div class="ch"><span class="ci">${col.ic}</span>
        <div><div class="ct">${col.t}</div><div class="cs">${col.s}</div></div>
        <span class="cn">${arr.length}</span>
      </div>
      <div class="body">${inner}</div>
    </div>`;
  }).join('');
  board.querySelectorAll('.kc[data-cid]').forEach(el=> el.onclick=()=> openDetalhe(el.dataset.cid));
}
function emptyCol(e,txt){ return `<div class="empty"><span class="e">${e}</span>${esc(txt)}</div>`; }
function prioridade(c){ return c.clienteAguardando===true ? 1 : 0; }

// Slots de moto de uma transferência: mostra as placas preenchidas (com tag Comfort/CPX) e os
// slots ainda vazios como "aguardando" — atualiza sozinho conforme o colab escaneia no local.
function slotsFleet(c){
  if(!ehTransf(c)) return '';
  const motos = Array.isArray(c.motos) ? c.motos : (c.motos && typeof c.motos === 'object' ? Object.assign([], c.motos) : []);
  const n = c.qtdMotos!=null ? c.qtdMotos : motos.length;
  if(!n) return '';
  let chips='';
  for(let i=0;i<n;i++){
    const m = motos[i];
    if(m && m.placa){
      const cat = m.categoria || catComfortCpx(m.modelo);
      const tag = cat ? ` <b style="font-size:8.5px;padding:0 4px;border-radius:4px;background:${cat==='CPX'?'#7c3aed':'#0891b2'};color:#fff">${cat}</b>` : '';
      chips += `<span style="font-family:var(--mono);font-size:10px;font-weight:800;background:rgba(0,180,229,.12);border:1px solid rgba(0,180,229,.35);color:var(--acc-br);padding:2px 6px;border-radius:6px">${esc(m.placa)}${tag}</span>`;
    } else {
      chips += `<span style="font-size:10px;color:var(--txt3);border:1px dashed var(--bdr2);padding:2px 6px;border-radius:6px">— aguardando —</span>`;
    }
  }
  return `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${chips}</div>`;
}
// Storytelling da transferência: a linha do tempo do chamado (aberto → carregado → em rota → entregue → concluído).
function storyFleet(c){
  if(!ehTransf(c)) return '';
  const mm = Array.isArray(c.motos) ? c.motos : (c.motos && typeof c.motos === 'object' ? Object.assign([], c.motos) : []);
  const nCheias = mm.filter(m=>m&&m.placa).length;
  const steps = [];
  if(c.abertoEm||c.ts) steps.push(['📢','Aberto'+(c.abertoPor?' por '+c.abertoPor:''), c.abertoEm||c.ts]);
  if(nCheias>0) steps.push(['🏍', nCheias+' placa(s) carregada(s)', null]);
  if(c.emRotaEm) steps.push(['🚚','Saiu da base (em rota)', c.emRotaEm]);
  if(c.descargaEm) steps.push(['🏁','Entregue em '+(baseNome(c.baseEntrega)||'—'), c.descargaEm]);
  if(c.concluidoEm) steps.push(['✅','Concluído', c.concluidoEm]);
  if(steps.length < 2) return '';
  return `<div style="margin-top:6px;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px;display:flex;flex-direction:column;gap:3px">`
    + steps.map(s=>`<div style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--txt2)"><span>${s[0]}</span><span style="flex:1">${esc(s[1])}</span>${s[2]?`<span style="color:var(--txt3);font-family:var(--mono);font-size:10px">${fmtDataHora(s[2])}</span>`:''}</div>`).join('')
    + `</div>`;
}
function card(c, etapaN){
  const num = c.seq!=null ? `<span class="num">#${c.seq}</span>` : '';
  const ctrl = controladorDe(c);
  const drv = driverDe(c);
  const aguard = c.clienteAguardando===true;
  const motos = Array.isArray(c.motos) ? c.motos : (c.motos && typeof c.motos === 'object' ? Object.assign([], c.motos) : null);
  const badges=[];
  if(aguard) badges.push(`<span class="b b-aguard">🙋 AGUARDANDO</span>`);
  const nSlots = c.qtdMotos!=null ? c.qtdMotos : (motos?motos.length:0);
  const nCheias = motos ? motos.filter(m=>m&&m.placa).length : 0;
  if(nSlots) badges.push(`<span class="b b-moto">🏍 ${nCheias}/${nSlots} placa${nSlots>1?'s':''}</span>`);
  if(ehTransf(c)) badges.push(`<span class="b b-transf">🚚 ${esc(baseNome(c.baseSaida)||'?')} → ${esc(baseNome(c.baseEntrega)||'?')}</span>`);
  if(ehTransf(c) && (c.descargaEm||c.descargaBaseNome)) badges.push(`<span class="b" style="background:rgba(22,163,74,.2);border:1px solid #16a34a;color:#4ade80;font-weight:800">✅ ENTREGUE</span>`);
  if(motos && motos.some(m=>m.iotForaDaBase)) badges.push(`<span class="b b-warn" title="Uma ou mais motos com IoT fora da base de saída">⚠ moto fora da base</span>`);
  if(c.terceiroId) badges.push(`<span class="b b-ext">🤝 externo</span>`);
  const whoLines=[];
  if(etapaN>=2 && ctrl) whoLines.push(whoLine('👮','Controlador',ctrl,'#00B4E5'));
  if(etapaN>=3 && drv) whoLines.push(whoLine('🛵','Motorista',drv,corDriver(c)));
  const rotaHint = (etapaN===4) ? `<div class="rotahint">🛰 em trajeto · clique pra ${c._fake?'simular':'ver'} no mapa</div>` : '';
  const abertoFoot = c.abertoPor
    ? `<div class="aberto">✍ Aberto por <b>${esc(c.abertoPor)}</b> · ${fmtDataHora(c.abertoEm||c.ts)}</div>` : '';
  return `<div class="kc${aguard?' aguard':''}" data-cid="${esc(c.id)}" style="--c:${etapaN===4?'var(--rota)':etapaN===3?'var(--atrib)':etapaN===2?'var(--aceito)':etapaN===6?'var(--conc)':'var(--novo)'}">
    <div class="r1">${num}<span class="cli">${esc(c.cliente||'Sem nome')}</span><span class="ico">${icoMotivo(c.motivo)}</span></div>
    <div class="mv">${esc(c.motivo||'—')}</div>
    ${c.endereco?`<div class="end">📍<span>${esc(c.endereco)}</span></div>`:''}
    ${badges.length?`<div class="badges">${badges.join('')}</div>`:''}
    ${slotsFleet(c)}
    ${(ehTransf(c) && (c.descargaEm||c.status==='concluido'))?storyFleet(c):''}
    ${whoLines.length?`<div class="who">${whoLines.join('')}</div>`:''}
    ${rotaHint}
    ${abertoFoot}
    <div class="meta"><span>${(motos&&motos.length)?'':esc((c.placa||'').slice(0,22))}</span><span>${etapaN===6?('✓ '+fmtTime(c.concluidoEm||c.ts)):('⏱ '+fmtElapsed(c.ts))}</span></div>
  </div>`;
}
function whoLine(ic,role,nome,cor){
  return `<div class="wl"><div class="av" style="background:${cor}">${esc((nome||'?').charAt(0).toUpperCase())}</div>
    <div class="wi"><div class="wr">${ic} ${role}</div><div class="wn">${esc(nome)}</div></div></div>`;
}

// ================= FIREBASE =================
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initFirebase(){
  await loadScript('https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = firebase.database().ref('vammo');
  const dot=$('#syncdot'), txt=$('#synctxt');
  firebase.database().ref('.info/connected').on('value', s=>{
    const on=!!s.val(); dot.classList.toggle('on',on); txt.textContent=on?'ao vivo':'reconectando…';
  });
  fb.child('chamados').on('value', s=>{ chamados=s.val()||{}; scheduleRender(); });
  fb.child('motoristas').on('value', s=>{ motoristas=s.val()||{}; scheduleRender(); });
  fb.child('bases').on('value', s=>{ bases=s.val()||{}; if(wiz && !wiz.baseEntrega) renderWizard(); scheduleRender(); });
  // corridas: pega tempos reais (em rota/chegou/concluiu) + nota pra o histórico do chamado
  fb.child('corridas').on('value', s=>{ const all=s.val()||{}; const map={}; for(const k in all){ const r=all[k]; if(r&&r.chamadoId) map[r.chamadoId]=r; } corridas=map; });
}

// ================= ABRIR CHAMADO (WIZARD DE MOVIMENTAÇÃO) =================

  { k:'churn_manut', em:'🔧', t:'Movimentação Churn / Manutenção', s:'Live Ops' }

const FORA_BASE_M = 800;       // ping a mais que isso da base de saída = "fora da base" (alerta)
const MAX_MOTOS = 40;
// Status da moto no sistema (bike.status) → rótulo PT + classe de cor
const MOTO_STATUS = {
  IN_STREET:['Na rua','ok'], RENTED:['Alugada','ok'], STORED:['Estocada','info'],
  AWAITING_ARRIVAL:['Aguard. chegada','warn'], AWAITING_ACTIVATION:['Aguard. ativação','warn'],

function statusMoto(code){ const m=MOTO_STATUS[code]; return m?{l:m[0],c:m[1]}:{l:(code||'—'),c:'muted'}; }
let wiz = null;

function clean(o){ const r={}; for(const k in o){ if(o[k]!==undefined&&o[k]!==null) r[k]=o[k]; } return r; }
function baseOpts(sel){
  return '<option value="">— selecionar base —</option>'+
    Object.entries(bases).filter(([id,b])=>b&&b.nome&&b.ativo!==false)
      .sort((a,b)=>(a[1].nome||'').localeCompare(b[1].nome||''))
      .map(([id,b])=>`<option value="${id}"${id===sel?' selected':''}>${esc(b.nome)}</option>`).join('');
}
function openModal(){
  wiz = { tipo:null, baseSaida:'', baseEntrega:'', qtd:1, motos:[{placa:''}] };
  $('#modal').classList.add('on');
  renderWizard();
}
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

function motosValidas(){ return wiz.motos.filter(m => m.placa && ['ok','forabase','iotoff'].includes(m.status)); }
function catComfortCpx(modelo){ const m=(modelo||'').toUpperCase(); if(m.includes('CPX')) return 'CPX'; if(m.includes('COMFORT')) return 'COMFORT'; return null; }
function setQtd(n){
  n = Math.max(1, Math.min(MAX_MOTOS, n|0));
  wiz.qtd = n;
  if(wiz.motos.length < n){ while(wiz.motos.length < n) wiz.motos.push({placa:''}); }
  else if(wiz.motos.length > n){ wiz.motos = wiz.motos.slice(0, n); }
}
function podeAbrir(){
  if(!wiz||!wiz.tipo||!wiz.baseSaida||!wiz.baseEntrega||!(wiz.qtd>=1)) return false;
  // placas são OPCIONAIS (o colab escaneia a placa no local); mas as que o Fleet digitar precisam estar válidas
  return wiz.motos.filter(m=>m.placa).every(m=>['ok','forabase','iotoff'].includes(m.status));
}
function updateGo(){ const g=$('#wGo'); if(g) g.disabled=!podeAbrir(); const c=$('#wMotoCount'); if(c) c.textContent=motosValidas().length; }

function renderWizard(){
  const w=wiz;
  const showSaida=!!w.tipo, showEntrega=showSaida&&w.baseSaida, showMotos=showEntrega&&w.baseEntrega;
  let h='';
  // 1 — tipo
  h+=`<div class="wsec"><div class="wlabel"><span class="wn">1</span> Tipo de chamado</div>
    <div class="wtipo">${TIPOS.map(t=>`<button data-tipo="${t.k}" class="${w.tipo===t.k?'sel':''}"><span class="em">${t.em}</span><div><div class="tt">${t.t}</div><div class="ts">${t.s}</div></div></button>`).join('')}</div></div>`;
  // 2 — base saída
  if(showSaida) h+=`<div class="wsec"><div class="wlabel"><span class="wn">2</span> Base de saída</div><select id="wSaida">${baseOpts(w.baseSaida)}</select></div>`;
  // 3 — base entrega
  if(showEntrega) h+=`<div class="wsec"><div class="wlabel"><span class="wn">3</span> Base de entrega</div><select id="wEntrega">${baseOpts(w.baseEntrega)}</select>${(w.baseEntrega&&w.baseEntrega===w.baseSaida)?'<div class="mstat warn">⚠ Saída e entrega são a mesma base.</div>':''}</div>`;
  // 4 — QUANTIDADE (numeral) define os slots; 5 — placas OPCIONAIS (o colab escaneia no local)
  if(showMotos) h+=`<div class="wsec"><div class="wlabel"><span class="wn">4</span> Quantas motos movimentar?</div>
    <div class="wqty"><button id="wQtyMinus" type="button">−</button><span class="qn" id="wQtyN">${w.qtd}</span><button id="wQtyPlus" type="button">＋</button>
      <span style="font-weight:600;text-transform:none;color:var(--txt3);letter-spacing:0">moto(s)</span></div>
    <div class="wlabel" style="margin-top:16px"><span class="wn">5</span> Placas <span style="font-weight:600;text-transform:none;color:var(--txt3);letter-spacing:0">· opcional — o colaborador escaneia no local</span></div>
    <div id="wizMotos"></div></div>`;
  // rodapé
  h+=`<div class="mrow"><button class="cancel" onclick="closeModal()">Cancelar</button><button class="go" id="wGo" onclick="abrirMov()" ${podeAbrir()?'':'disabled'}>📢 Abrir movimentação</button></div>`;
  $('#wizBody').innerHTML=h;
  // binds
  document.querySelectorAll('#wizBody [data-tipo]').forEach(b=> b.onclick=()=>{ wiz.tipo=b.dataset.tipo; renderWizard(); });
  { const s=$('#wSaida'); if(s) s.onchange=()=>{ wiz.baseSaida=s.value; recheckMotos(); renderWizard(); }; }
  { const e=$('#wEntrega'); if(e) e.onchange=()=>{ wiz.baseEntrega=e.value; renderWizard(); }; }
  { const mn=$('#wQtyMinus'); if(mn) mn.onclick=()=>{ setQtd(wiz.qtd-1); const n=$('#wQtyN'); if(n) n.textContent=wiz.qtd; renderMotoCards(); updateGo(); }; }
  { const pl=$('#wQtyPlus'); if(pl) pl.onclick=()=>{ setQtd(wiz.qtd+1); const n=$('#wQtyN'); if(n) n.textContent=wiz.qtd; renderMotoCards(); updateGo(); setTimeout(()=>{ const inp=$('#mp-'+(wiz.motos.length-1)); if(inp) inp.focus(); },30); }; }
  if(showMotos) renderMotoCards();
  updateGo();
}

function statClass(m){ return m.status==='ok'?'ok':(m.status==='forabase'?'warn':(m.status==='notfound'||m.status==='short'?'err':'info')); }
function statText(m){
  const st = m.motoStatus ? `<span class="mstag ${statusMoto(m.motoStatus).c}">${esc(statusMoto(m.motoStatus).l)}</span>` : '';
  switch(m.status){
    case 'checking': return '🔎 verificando…';
    case 'notfound': return '✗ placa não encontrada na base Vammo';
    case 'short':    return 'digite a placa completa';
    case 'ok':       return `${st}✓ ${esc(m.modelo||'moto')} · placa válida`;
    case 'iotoff':   return `${st}✓ ${esc(m.modelo||'moto')} · 📡 IoT offline (local não confirmado)`;
    case 'forabase': return `${st}⚠ <b>FORA da base de saída</b> — 📡 IoT ${m.iotLocal?('perto de '+esc(m.iotLocal)):'em outro local'} (~${(m.iotDist/1000).toFixed(1)}km)`;
    default:         return m.placa ? '' : 'digite ou busque a placa';
  }
}
function renderMotoCards(){
  const wrap=$('#wizMotos'); if(!wrap) return;
  wrap.innerHTML = wiz.motos.map((mo,i)=>`
    <div class="moto-card">
      <div class="mh"><span class="mnum">${i+1}</span> Moto ${i+1} <span style="font-weight:600;color:var(--txt3);font-size:11px">(placa opcional)</span></div>
      <div class="acwrap">
        <input id="mp-${i}" placeholder="O colab escaneia no local — ou digite aqui" maxlength="8" value="${esc(mo.placa||'')}" autocomplete="off" spellcheck="false">
        <div class="acdd" id="mdd-${i}"></div>
      </div>
      <div class="mstat ${statClass(mo)}" id="mstat-${i}">${statText(mo)}</div>
    </div>`).join('');
  wiz.motos.forEach((mo,i)=>{
    const inp=$('#mp-'+i);
    inp.addEventListener('input', ()=>{ onPlacaInput(i, inp.value); });
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); hideDD(i); inp.blur(); } });
    inp.addEventListener('blur', ()=>{ setTimeout(()=>{ hideDD(i); const m=wiz.motos[i]; if(m && m.placa && !['ok','forabase','iotoff','checking'].includes(m.status)) checkMoto(i); }, 180); });
  });
  // remoção individual saiu — a QUANTIDADE (stepper) controla o nº de slots
}
function updateMotoStat(i){
  const el=$('#mstat-'+i); if(!el) return;
  const m=wiz.motos[i]; el.className='mstat '+statClass(m); el.innerHTML=statText(m);
}
function recheckMotos(){ wiz.motos.forEach((m,i)=>{ if(m.placa && ['ok','forabase','iotoff'].includes(m.status)) checkIoT(i); }); }

// ---- Autocomplete de placa (busca na base enquanto digita) ----
const _acTimers={};
function hideDD(i){ const dd=$('#mdd-'+i); if(dd){ dd.innerHTML=''; dd.classList.remove('on'); } }
function onPlacaInput(i, val){
  const q=(val||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  wiz.motos[i]={placa:q};           // reseta validação enquanto edita
  updateMotoStat(i); updateGo();
  if(_acTimers[i]) clearTimeout(_acTimers[i]);
  if(q.length<2){ hideDD(i); return; }
  _acTimers[i]=setTimeout(async ()=>{
    try{
      const d=await (await fetch('/api/moto_search?q='+encodeURIComponent(q))).json();
      const res=(d&&d.results)||[];
      const dd=$('#mdd-'+i); if(!dd) return;
      if(!res.length){ dd.innerHTML=`<div class="acempty">nenhuma placa começando com <b>${esc(q)}</b></div>`; dd.classList.add('on'); return; }
      dd.innerHTML=res.map((r,j)=>{ const s=statusMoto(r.status); return `<div class="acitem" data-j="${j}"><span class="acpl">${esc(r.placa)}</span><span class="acmo">${esc(r.modelo||'')}</span><span class="mstag ${s.c}">${esc(s.l)}</span></div>`; }).join('');
      dd.classList.add('on');
      dd.querySelectorAll('.acitem').forEach(el=> el.onmousedown=(ev)=>{ ev.preventDefault(); pickMoto(i, res[+el.dataset.j]); });
    }catch(_){}
  }, 230);
}
function pickMoto(i, r){
  const inp=$('#mp-'+i); if(inp) inp.value=r.placa;
  wiz.motos[i]={ placa:r.placa, modelo:r.modelo||'moto', motoStatus:r.status||null, deposito:r.deposito||null };
  hideDD(i);
  checkIoT(i);   // já temos os dados da moto; só falta conferir o IoT vs base de saída
}

async function checkMoto(i){
  const m=wiz.motos[i]; const placa=(m.placa||'').replace(/[^A-Z0-9]/g,'');
  if(!placa){ m.status='idle'; updateMotoStat(i); updateGo(); return; }
  if(placa.length<6){ m.status='short'; updateMotoStat(i); updateGo(); return; }
  m.status='checking'; updateMotoStat(i); updateGo();
  try{
    const d=await (await fetch('/api/moto_lookup?placa='+encodeURIComponent(placa))).json();
    if(!d||!d.found){ m.status='notfound'; updateMotoStat(i); updateGo(); return; }
    m.found=true; m.modelo=d.modelo||'moto'; m.motoStatus=d.status||null; m.deposito=d.deposito||null;
    await checkIoT(i);
  }catch(e){ m.status='notfound'; updateMotoStat(i); updateGo(); }
}
// FLEET NÃO considera o ping/IoT da moto: movimentação nem sempre tem ping confiável e dava falso
// "fora da base", atrapalhando a abertura. A placa existir na base Vammo (moto_lookup) já basta.
async function checkIoT(i){
  const m=wiz.motos[i];
  m.status='ok'; m.iotDist=null; m.iotLocal=null;
  updateMotoStat(i); updateGo();
}

async function abrirMov(){
  if(!podeAbrir()) return;
  const w=wiz, nS=baseNome(w.baseSaida), nE=baseNome(w.baseEntrega);
  const motos=motosValidas();     // placas que o Fleet OPTOU por preencher (pode ser nenhuma)
  const qtd=w.qtd;                // quantidade = o NUMERAL escolhido (não o nº de placas)
  const fora=motos.filter(m=>m.status==='forabase');
  if(fora.length && !confirm(`⚠ ${fora.length} moto(s) com IoT FORA da base de saída (${nS}):\n`+
    fora.map(m=>`• ${m.placa} — ${m.iotLocal||'outro local'} (~${(m.iotDist/1000).toFixed(1)}km)`).join('\n')+
    `\n\nA moto provavelmente não está na base. Abrir mesmo assim?`)) return;
  const g=$('#wGo'); g.disabled=true; g.textContent='⏳ Abrindo…';
  const bs=bases[w.baseSaida]||{};
  const ch={
    id:genId(), ts:Date.now(),
    tipoMovimentacao:w.tipo, motivo:tipoLabel(w.tipo),
    cliente:`${nS} → ${nE} · ${qtd} moto${qtd>1?'s':''}`,
    qtdMotos:qtd, baseSaida:w.baseSaida, baseEntrega:w.baseEntrega,
    motos:motos.map(m=>clean({ placa:m.placa, modelo:m.modelo||null, categoria:catComfortCpx(m.modelo), motoStatus:m.motoStatus||null,
      iotForaDaBase:m.status==='forabase'?true:null, iotDistM:m.iotDist!=null?Math.round(m.iotDist):null,
      iotLocal:m.iotLocal||null, iotOffline:m.status==='iotoff'?true:null })),
    placa:motos.map(m=>m.placa).join(', ').slice(0,80),
    endereco:bs.endereco||bs.nome||nS, lat:(bs.lat!=null?bs.lat:null), lng:(bs.lng!=null?bs.lng:null),
    status:'novo', clienteAguardando:false, origemFleet:true,
    abertoPor:currentUser.nome, abertoPorEmail:currentUser.email, abertoEm:Date.now()
  };
  try{
    await new Promise(res=>{ try{ fb.child('counters/seqDia').transaction(cur=>{ const d=new Date(), dia=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); return (cur&&cur.dia===dia)?{dia,n:(cur.n||0)+1}:{dia,n:1}; },(e,ok,s)=>{ if(ok&&s&&s.val()){ const v=s.val(); ch.seq=v.n; ch.ticket=v.dia.replace(/-/g,'')+'-'+String(v.n).padStart(3,'0'); } res(); }); }catch(_){ res(); } });
    await fb.child('chamados/'+ch.id).set(clean(ch));
    toast(`📢 Movimentação #${ch.seq||''} aberta na Torre!`);
    closeModal();
  }catch(err){ toast('❌ erro ao abrir: '+err.message, true); g.disabled=false; g.textContent='📢 Abrir movimentação'; }
}

// ================= DETALHE / HISTÓRICO DO CHAMADO =================
function findChamado(id){ return demoChamados.find(x=>x.id===id) || chamados[id] || Object.values(chamados).find(x=>x.id===id) || null; }
function fmtDur(ms){ if(ms==null||ms<0) return '—'; const s=Math.round(ms/1000); if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'min'; const h=Math.floor(m/60); const r=m%60; return h+'h'+(r?(' '+r+'min'):''); }
const STAGE_DEFS = [
  {ic:'📢', label:'Chamado aberto',        get:(c,r)=>c.abertoEm||c.ts},
  {ic:'✋', label:'Aceito pela torre',      get:(c,r)=>c.aceitoEm},
  {ic:'🧑‍🔧', label:'Atribuído ao motorista', get:(c,r)=>c.atribuidoEm||(r&&r.assignedTs)},
  {ic:'🚚', label:'Em rota (saiu da base)', get:(c,r)=>c.emRotaEm||(r&&r.enRouteTs)},
  {ic:'📍', label:'Chegou no destino',      get:(c,r)=>c.chegouEm||(r&&r.arrivedTs)},
  {ic:'🏁', label:'Entregue (descarregado na base)', get:(c,r)=>c.descargaEm},
  {ic:'✅', label:'Concluído',              get:(c,r)=>c.concluidoEm||(r&&r.completedTs)}
];
function detStatusChip(c){
  if(ehTransf(c) && (c.descargaEm||c.descargaBaseNome) && c.status!=='cancelado'){
    return `<span class="det-chip" style="background:#16a34a;color:#04121e">✅ Entregue</span>`;
  }
  const map={1:['Aberto','var(--novo)'],2:['Aceito','var(--aceito)'],3:['Atribuído','var(--atrib)'],4:['Em rota','var(--rota)'],6:['Concluído','var(--conc)']};
  const [t,cor]=map[etapa(c)]||['—','var(--txt3)'];
  return `<span class="det-chip" style="background:${cor};color:#04121e">${t}</span>`;
}
function openDetalhe(id){
  const c=findChamado(id); if(!c) return;
  const r=corridas[c.id]||null, e=etapa(c);
  // Timeline: só as etapas que já aconteceram (têm timestamp)
  let prev=null;
  const rows = STAGE_DEFS.map(s=>{
    const ts=s.get(c,r); if(!ts) return null;
    const dur = prev ? `<div class="tl-dur">+${fmtDur(ts-prev)}</div>` : '';
    prev=ts;
    return `<div class="tl-row"><div class="tl-ic">${s.ic}</div><div class="tl-bd"><div class="tl-l">${s.label}</div><div class="tl-t">${fmtDataHora(ts)}</div></div>${dur}</div>`;
  }).filter(Boolean).join('');
  const abTs=c.abertoEm||c.ts, endTs=c.concluidoEm||(r&&r.completedTs)||Date.now();
  const totVal=fmtDur(endTs-abTs);
  const nota=c.nota||(r&&r.nota)||null, notaV=nota?(nota.final!=null?nota.final:nota):null;
  const motos=Array.isArray(c.motos)?c.motos:[], ctrl=controladorDe(c), drv=driverDe(c);
  const rotaBtn = (e===4)
    ? (c._fake
       ? `<button class="det-btn" onclick="openSimulador('${esc(c.id)}')">▶ Simular rota em tempo real</button>`
       : `<a class="det-btn" href="/track?id=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">🛰 Ver trajeto ao vivo</a>`)
    : '';
  $('#detBody').innerHTML = `
    <div class="deth">
      <div><h2>${c.seq!=null?`<span style="font-family:var(--mono);color:var(--acc)">#${c.seq}</span> `:''}${esc(c.cliente||'Chamado')}</h2>${c.ticket?`<div style="font-size:10px;color:var(--txt3);font-family:var(--mono);margin-top:2px">🎫 ${esc(c.ticket)}</div>`:''}${detStatusChip(c)}</div>
      <button class="mx" onclick="closeDetalhe()">✕</button>
    </div>
    <div style="font-size:12px;color:var(--txt2);margin-top:8px">${icoMotivo(c.motivo)} ${esc(c.motivo||'—')}</div>
    ${ehTransf(c)?`<div style="font-size:13px;font-weight:700;margin-top:6px;color:#d8b4fe">🚚 ${esc(baseNome(c.baseSaida))} → ${esc(baseNome(c.baseEntrega))}</div>`:''}
    ${rotaBtn}
    <div class="det-total"><span class="tl">${(c.status==='concluido')?'⏱ Tempo total de execução':'⏱ Tempo decorrido'}</span><span class="tv">${totVal}</span></div>
    ${notaV!=null?`<div style="margin-top:10px"><span class="det-nota">⭐ Nota ${notaV}</span></div>`:''}
    <div class="det-sec"><div class="st">📋 Histórico · tempo de cada etapa</div>${rows||'<div style="color:var(--txt3);font-size:12px">Sem etapas registradas ainda.</div>'}</div>
    ${motos.length?`<div class="det-sec"><div class="st">🏍 ${motos.length} moto${motos.length>1?'s':''}</div><div class="det-motos">${motos.map(m=>`<div class="det-moto"><span class="pl">${esc(m.placa)}</span><span class="mo">${esc(m.modelo||'')}</span>${m.iotForaDaBase?'<span style="margin-left:auto;font-size:9px;font-weight:800;color:#1a1200;background:#f59e0b;padding:1px 6px;border-radius:5px">⚠ fora da base</span>':''}</div>`).join('')}</div></div>`:''}
    <div class="det-sec"><div class="st">👥 Responsáveis</div><div class="det-motos">
      ${ctrl?`<div class="det-moto"><span>👮</span><span class="pl">${esc(ctrl)}</span><span class="mo">controlador</span></div>`:''}
      ${drv?`<div class="det-moto"><span>🛵</span><span class="pl">${esc(drv)}</span><span class="mo">motorista</span></div>`:''}
      ${c.abertoPor?`<div class="det-moto"><span>✍</span><span class="pl">${esc(c.abertoPor)}</span><span class="mo">abriu · ${fmtDataHora(c.abertoEm||c.ts)}</span></div>`:''}
    </div></div>`;
  $('#det').classList.add('on');
}
function closeDetalhe(){ $('#det').classList.remove('on'); }
$('#det').addEventListener('click', e=>{ if(e.target.id==='det') closeDetalhe(); });

// ================= SIMULADOR DE ROTA (demo — motorista em rota no mapa) =================
let _leaflet=false;
async function ensureLeaflet(){
  if(_leaflet && window.L) return;
  if(!document.querySelector('link[data-lf]')){ const l=document.createElement('link'); l.rel='stylesheet'; l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; l.setAttribute('data-lf','1'); document.head.appendChild(l); }
  if(!window.L) await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  _leaflet=true;
}
let sim={ map:null, timer:null, coords:[], idx:0, marker:null, playing:false, durMs:34000, routeMin:0 };
async function openSimulador(id){
  const c=findChamado(id); if(!c) return;
  const from=c._simFrom||(c.baseSaida&&bases[c.baseSaida]&&bases[c.baseSaida].lat!=null?{lat:bases[c.baseSaida].lat,lng:bases[c.baseSaida].lng}:null);
  const to  =c._simTo  ||(c.baseEntrega&&bases[c.baseEntrega]&&bases[c.baseEntrega].lat!=null?{lat:bases[c.baseEntrega].lat,lng:bases[c.baseEntrega].lng}:null);
  if(!from||!to){ toast('Sem coordenadas das bases pra simular', true); return; }
  closeDetalhe();
  $('#sim').classList.add('on');
  $('#simTitle').textContent = `${baseNome(c.baseSaida)} → ${baseNome(c.baseEntrega)}`;
  $('#simSub').textContent='carregando rota…';
  $('#simDriverN').textContent = driverDe(c)||'Motorista';
  await ensureLeaflet();
  await simInit(from, to);
}
async function simInit(from, to){
  simStop();
  if(sim.map){ sim.map.remove(); sim.map=null; }
  sim.map = L.map($('#simMap'), {zoomControl:true, attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {subdomains:'abcd', maxZoom:19}).addTo(sim.map);
  const pin=(emoji)=>L.divIcon({className:'sim-pin', html:`<div>${emoji}</div>`, iconSize:[26,26], iconAnchor:[13,24]});
  L.marker([from.lat,from.lng], {icon:pin('🏁')}).addTo(sim.map);
  L.marker([to.lat,to.lng], {icon:pin('🎯')}).addTo(sim.map);
  let coords=[[from.lat,from.lng],[to.lat,to.lng]], mins=0, real=false;
  try{
    const u=`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
    const d=await (await fetch(u)).json();
    const rt=d.routes&&d.routes[0];
    if(rt && rt.geometry){ coords=rt.geometry.coordinates.map(p=>[p[1],p[0]]); mins=Math.round(rt.duration/60); real=true; }
  }catch(_){}
  sim.coords=coords; sim.routeMin=mins; sim.idx=0;
  L.polyline(coords, {color:'#00B4E5', weight:5, opacity:.85, dashArray:'10,8'}).addTo(sim.map);
  sim.marker = L.marker(coords[0], {icon:L.divIcon({className:'sim-marker', html:'<div>🛵</div>', iconSize:[34,34], iconAnchor:[17,17]}), zIndexOffset:1000}).addTo(sim.map);
  sim.map.fitBounds(L.latLngBounds(coords).pad(0.15));
  setTimeout(()=>{ if(sim.map) sim.map.invalidateSize(); }, 80);
  $('#simSub').textContent = `${real?'trajeto real (OSRM)':'linha reta'} · ETA ~${mins||'—'} min`;
  simPlay();
}
function simRender(){
  const n=sim.coords.length; if(!n) return;
  const pos=sim.coords[Math.min(Math.floor(sim.idx),n-1)];
  if(sim.marker&&pos) sim.marker.setLatLng(pos);
  const prog=n>1?Math.min(1, sim.idx/(n-1)):1;
  $('#simBar').style.width=(prog*100).toFixed(1)+'%';
  $('#simEta').textContent = prog>=1 ? '✓ chegou no destino' : `ETA ~${Math.max(0,Math.round(sim.routeMin*(1-prog)))} min · ${Math.round(prog*100)}%`;
}
function simStep(){
  const n=sim.coords.length; if(n<2) return;
  sim.idx += n/(sim.durMs/120);
  if(sim.idx>=n-1){ sim.idx=n-1; simRender(); simStop(); sim.playing=false; $('#simPlay').textContent='↺ Refazer'; return; }
  simRender();
}
function simStop(){ if(sim.timer){ clearInterval(sim.timer); sim.timer=null; } }
function simPlay(){ simStop(); if(sim.idx>=sim.coords.length-1) sim.idx=0; sim.playing=true; $('#simPlay').textContent='⏸ Pausar'; sim.timer=setInterval(simStep,120); simRender(); }
function simTogglePlay(){ if(sim.playing){ simStop(); sim.playing=false; $('#simPlay').textContent='▶ Continuar'; } else { simPlay(); } }
function simRestart(){ sim.idx=0; simPlay(); }
function closeSimulador(){ simStop(); $('#sim').classList.remove('on'); if(sim.map){ sim.map.remove(); sim.map=null; } }
$('#sim').addEventListener('click', e=>{ if(e.target.id==='sim') closeSimulador(); });

// ================= AUTH (Google @vammo.com) =================
function parseJwt(t){
  try{ return JSON.parse(decodeURIComponent(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''))); }
  catch(_){ return null; }
}
function entrar(u){
  currentUser=u; localStorage.setItem('fleet_user', JSON.stringify(u));
  $('#gate').style.display='none';
  const uc=$('#userchip'); uc.style.display='flex';
  uc.innerHTML=`${u.picture?`<img src="${esc(u.picture)}" referrerpolicy="no-referrer">`:''}<span class="un">${esc((u.nome||u.email).split(' ')[0])}</span><button class="lo" title="Sair" onclick="sair()">⏻</button>`;
  initFirebase().catch(e=>{ console.error(e); toast('Erro ao conectar ao Firebase', true); });
}
function sair(){ localStorage.removeItem('fleet_user'); location.reload(); }
function onCredential(resp){
  const p=parseJwt(resp.credential);
  if(!p||!p.email){ $('#gerr').textContent='Não consegui ler a conta. Tente de novo.'; return; }
  if(!/@vammo\.com$/i.test(p.email)){ $('#gerr').textContent='Use uma conta @vammo.com para acessar.'; return; }
  entrar({ email:p.email, nome:p.name||p.email, picture:p.picture||'' });
}
function initAuth(){
  const saved=(()=>{ try{ return JSON.parse(localStorage.getItem('fleet_user')||'null'); }catch(_){ return null; } })();
  if(saved && saved.email && /@vammo\.com$/i.test(saved.email)){ entrar(saved); return; }
  loadScript('https://accounts.google.com/gsi/client').then(()=>{
    try{
      google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:onCredential });
      google.accounts.id.renderButton($('#gbtn'), { theme:'filled_blue', size:'large', text:'signin_with', shape:'pill', width:280 });
      google.accounts.id.prompt();
    }catch(e){ $('#gerr').textContent='Falha ao carregar o login do Google.'; }
  }).catch(()=>{ $('#gerr').textContent='Sem conexão com o login do Google.'; });
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeSimulador(); closeDetalhe(); closeModal(); } });

// ================= INTRO / SPLASH =================
function runIntro(){
  const w=document.getElementById('introWord');
  if(w){
    const txt='CENTRAL DE FLEET', hl=txt.indexOf('FLEET');
    let html='', d=0.72;
    for(let i=0;i<txt.length;i++){
      const ch=txt[i];
      if(ch===' '){ html+='<span class="sp"></span>'; continue; }
      html+=`<span class="${i>=hl?'hl':''}" style="animation-delay:${d.toFixed(2)}s">${ch}</span>`;
      d+=0.05;
    }
    w.innerHTML=html;
  }
  const intro=document.getElementById('intro');
  setTimeout(()=>{ if(intro) intro.classList.add('done'); }, 2650);
  setTimeout(()=>{ if(intro){ intro.style.display='none'; } }, 3320);
}
runIntro();
initAuth();
console.log('Vammo Fleet', FLEET_VERSION);
try{ const _fv=document.getElementById('fleetVer'); if(_fv) _fv.textContent=FLEET_VERSION; }catch(_){}
